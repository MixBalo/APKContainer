name: Build and Commit ANGLE Binaries

on:
  workflow_dispatch:

jobs:
  build-angle:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "15.4"

      - name: Fake macOS 15 SDK symlink
        run: |
          sudo ln -sf /Applications/Xcode_15.4.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk \
            /Applications/Xcode_15.4.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX15.0.sdk

      - name: Build ANGLE for iOS
        run: |
          set -e
          echo "=== depot_tools ==="
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$HOME/depot_tools"
          export PATH="$HOME/depot_tools:$PATH"

          echo "=== Fetch ANGLE ==="
          mkdir -p "$HOME/angle-work"
          cd "$HOME/angle-work"
          fetch angle

          echo "=== Build ==="
          cd src
          gn gen out/ios --args='
            target_os="ios"
            target_cpu="arm64"
            target_environment="device"
            is_debug=false
            ios_enable_code_signing=false
            angle_enable_vulkan=false
            angle_enable_gl=false
            angle_enable_metal=true
            use_thin_archives=false
          '
          autoninja -C out/ios libEGL_static libGLESv2_static

      - name: Find all .a files
        run: |
          echo "=== All .a files in out/ios ==="
          find $HOME/angle-work/src/out/ios -name "*.a" -type f -exec ls -lh {} \;
          echo "=== File types ==="
          find $HOME/angle-work/src/out/ios -name "*.a" -type f -exec file {} \;

      - name: Upload full build tree as artifact
        uses: actions/upload-artifact@v4
        with:
          name: angle-full-build-tree
          path: ~/angle-work/src/out/ios/
          retention-days: 5

      - name: Repack into fat archives (guaranteed)
        run: |
          set -e
          mkdir -p "${{ github.workspace }}/Native/ANGLE/lib"

          EGL_SRC=$(find $HOME/angle-work/src/out/ios -name "libEGL_static.a" | head -1)
          GLES_SRC=$(find $HOME/angle-work/src/out/ios -name "libGLESv2_static.a" | head -1)

          echo "EGL source: $EGL_SRC"
          echo "GLES source: $GLES_SRC"

          # Repack libEGL — extracts all .o files and rebuilds a real archive
          TMP_EGL=$(mktemp -d)
          cd "$TMP_EGL"
          ar x "$EGL_SRC"
          ar rcs "${{ github.workspace }}/Native/ANGLE/lib/libEGL.a" *.o
          cd ..
          rm -rf "$TMP_EGL"

          # Repack libGLESv2
          TMP_GLES=$(mktemp -d)
          cd "$TMP_GLES"
          ar x "$GLES_SRC"
          ar rcs "${{ github.workspace }}/Native/ANGLE/lib/libGLESv2.a" *.o
          cd ..
          rm -rf "$TMP_GLES"

          echo "=== Final files ==="
          ls -lh "${{ github.workspace }}/Native/ANGLE/lib/"
          file "${{ github.workspace }}/Native/ANGLE/lib/"*

      - name: Upload repacked libraries as artifact
        uses: actions/upload-artifact@v4
        with:
          name: angle-repacked-libraries
          path: Native/ANGLE/lib/
          retention-days: 30

      - name: Commit to repo
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add Native/ANGLE/lib/
          git diff --cached --quiet || git commit -m "Add ANGLE static libraries for iOS arm64"
          git pull --rebase origin main
          git push
