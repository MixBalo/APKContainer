name: Build ANGLE (iOS / ARM64)

on:
  workflow_dispatch:

jobs:
  build-angle:
    name: Build Static Libraries
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Get Week Number for Cache Key
        id: week
        run: echo "week=$(date +%Y-%U)" >> "$GITHUB_OUTPUT"

      - name: Cache depot_tools
        uses: actions/cache@v4
        with:
          path: ~/depot_tools
          key: depot-tools-${{ runner.os }}-${{ steps.week.outputs.week }}
          restore-keys: |
            depot-tools-${{ runner.os }}-

      - name: Install depot_tools
        run: |
          if [ ! -d "$HOME/depot_tools" ]; then
            git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$HOME/depot_tools"
          else
            echo "depot_tools restored from cache."
          fi
          echo "$HOME/depot_tools" >> "$GITHUB_PATH"

      - name: Cache ANGLE Source
        id: cache-angle
        uses: actions/cache@v4
        with:
          path: angle-work
          key: angle-source-${{ runner.os }}-${{ steps.week.outputs.week }}-${{ hashFiles('.github/workflows/build-angle.yml') }}
          restore-keys: |
            angle-source-${{ runner.os }}-

      - name: Fetch ANGLE Source Code
        if: steps.cache-angle.outputs.cache-hit != 'true'
        run: |
          rm -rf angle-work
          mkdir -p angle-work
          cd angle-work
          fetch angle

      - name: Sync ANGLE (if cached)
        if: steps.cache-angle.outputs.cache-hit == 'true'
        run: |
          cd angle-work
          gclient sync --no-history --jobs=4 || true

      - name: Generate Build Files (gn)
        run: |
          cd angle-work/src
          gn gen out/ios --args='
            target_os="ios"
            target_cpu="arm64"
            target_environment="device"
            is_debug=false
            ios_enable_code_signing=false
            angle_enable_vulkan=false
            angle_enable_gl=false
            angle_enable_metal=true
            use_thin_archives=false
          '

      - name: Compile ANGLE (autoninja)
        run: |
          cd angle-work/src
          autoninja -C out/ios libEGL_static libGLESv2_static

      - name: Convert Thin Archives to Fat Archives
        run: |
          cd angle-work/src/out/ios/obj
          mkdir -p repacked

          repack_archive() {
            local lib_name=$1
            local archive_path="$lib_name.a"
            local output_name="${lib_name%_static}.a"
            local output_path="repacked/$output_name"

            echo "==> Processing $archive_path..."

            if [ ! -f "$archive_path" ]; then
              echo "ERROR: $archive_path not found!"
              ls -la
              exit 1
            fi

            rm -rf "extract_$lib_name"
            mkdir -p "extract_$lib_name"
            cd "extract_$lib_name"

            echo "  Extracting objects from $archive_path..."
            ar -x "../$archive_path"

            local obj_count
            obj_count=$(find . -name "*.o" -type f | wc -l | tr -d ' ')
            if [ "$obj_count" -eq 0 ]; then
              echo "  ERROR: No .o files extracted!"
              cd ..
              rm -rf "extract_$lib_name"
              exit 1
            fi

            echo "  Repacking $obj_count objects into $output_name..."
            find . -name "*.o" -type f -print0 | xargs -0 ar -rcs "../$output_path"

            cd ..

            local final_size
            final_size=$(stat -f%z "$output_path" 2>/dev/null || stat -c%s "$output_path" 2>/dev/null || echo "0")

            if [ "$final_size" -lt 1024 ]; then
              echo "  ERROR: Archive too small (${final_size} bytes)!"
              rm -rf "extract_$lib_name"
              exit 1
            fi

            echo "  ✓ Success: $output_path (${final_size} bytes)"
            file "$output_path"
            ls -lh "$output_path"

            rm -rf "extract_$lib_name"
          }

          repack_archive "libEGL_static"
          repack_archive "libGLESv2_static"

      - name: Upload Fat Archives
        uses: actions/upload-artifact@v4
        with:
          name: angle-ios-static-libs
          path: angle-work/src/out/ios/obj/repacked/*.a
          retention-days: 7
