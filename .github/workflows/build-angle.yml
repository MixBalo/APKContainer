name: Build ANGLE (iOS / ARM64)

on:
  workflow_dispatch:

jobs:
  build-angle:
    name: Build Static Libraries
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install depot_tools
        run: |
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git $HOME/depot_tools
          echo "$HOME/depot_tools" >> $GITHUB_PATH

      - name: Fetch ANGLE Source Code
        run: |
          mkdir -p angle-work
          cd angle-work
          fetch angle

      - name: Generate Build Files (gn)
        run: |
          cd angle-work/src
          gn gen out/ios --args='
            target_os="ios"
            target_cpu="arm64"
            target_environment="device"
            is_debug=false
            ios_enable_code_signing=false
            angle_enable_vulkan=false
            angle_enable_gl=false
            angle_enable_metal=true
            use_thin_archives=false
          '

      - name: Compile ANGLE (autoninja)
        run: |
          cd angle-work/src
          autoninja -C out/ios libEGL_static libGLESv2_static

      - name: Convert Thin Archives to Fat Archives
        run: |
          cd angle-work/src/out/ios/obj
          mkdir -p repacked
          
          for lib in libEGL_static libGLESv2_static; do
            echo "==> Processing $lib.a..."
            
            # Check if it's a thin archive
            if file "$lib.a" | grep -q "thin archive"; then
              echo "  Thin archive detected. Converting to fat archive using libtool..."
              
              # Use libtool to convert thin to fat archive
              # libtool -static creates a fat archive from thin archive input
              libtool -static -o "repacked/${lib%_static}.a" "$lib.a"
              
              # Verify conversion
              if file "repacked/${lib%_static}.a" | grep -q "thin archive"; then
                echo "  ERROR: Failed to convert thin archive to fat archive!"
                echo "  Archive info:"
                file "repacked/${lib%_static}.a"
                exit 1
              fi
              
              echo "  ✓ Successfully converted to fat archive"
            else
              echo "  Regular (fat) archive detected. Copying as-is..."
              cp "$lib.a" "repacked/${lib%_static}.a"
            fi
            
            echo "  Result:"
            ls -lh "repacked/${lib%_static}.a"
            file "repacked/${lib%_static}.a"
          done

      - name: Upload Fat Archives
        uses: actions/upload-artifact@v4
        with:
          name: angle-ios-static-libs
          path: angle-work/src/out/ios/obj/repacked/*.a
          retention-days: 7
