name: Build ANGLE iOS ARM64 Static Libraries

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-angle.yml"

permissions:
  contents: read

jobs:
  build-angle:
    name: Build ANGLE - iOS arm64
    runs-on: macos-latest

    env:
      ANGLE_DIR: ${{ github.workspace }}/angle-work
      OUT_DIR: ${{ github.workspace }}/angle-work/out/ios-arm64
      ARTIFACT_DIR: ${{ github.workspace }}/angle-artifacts

    steps:
      # ============================================================
      # 1. CHECKOUT APKContainer
      # ============================================================

      - name: Checkout APKContainer
        uses: actions/checkout@v6

      # ============================================================
      # 2. XCODE
      # ============================================================

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail

          echo "Available Xcodes:"
          ls -1 /Applications | grep '^Xcode' || true

          # macos-latest normally already has a suitable Xcode.
          # Do not hard-code a version that may disappear from the runner.
          if [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi

          echo "Xcode:"
          xcodebuild -version

          echo "Developer directory:"
          xcode-select -p

      - name: Accept Xcode License
        shell: bash
        run: |
          set -euo pipefail
          sudo xcodebuild -license accept

      - name: Verify iOS SDK
        shell: bash
        run: |
          set -euo pipefail

          IOS_SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          IOS_SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"

          echo "iOS SDK:"
          echo "$IOS_SDK"

          echo "iOS SDK version:"
          echo "$IOS_SDK_VERSION"

          test -d "$IOS_SDK"

      # ============================================================
      # 3. TOOLCHAIN
      # ============================================================

      - name: Verify Apple Toolchain
        shell: bash
        run: |
          set -euo pipefail

          echo "clang:"
          xcrun --sdk iphoneos clang --version

          echo ""
          echo "clang++:"
          xcrun --sdk iphoneos clang++ --version

          echo ""
          echo "ar:"
          xcrun --sdk iphoneos -f ar

          echo ""
          echo "ranlib:"
          xcrun --sdk iphoneos -f ranlib

          echo ""
          echo "nm:"
          xcrun --sdk iphoneos -f nm

          echo ""
          echo "lipo:"
          xcrun --sdk iphoneos -f lipo

          echo ""
          echo "ninja:"
          ninja --version || true

      # ============================================================
      # 4. DEPOT TOOLS
      # ============================================================

      - name: Cache depot_tools
        uses: actions/cache@v5
        with:
          path: ~/depot_tools
          key: depot-tools-${{ runner.os }}-v2
          restore-keys: |
            depot-tools-${{ runner.os }}-

      - name: Install / Update depot_tools
        shell: bash
        run: |
          set -euo pipefail

          DEPOT="$HOME/depot_tools"

          if [ ! -d "$DEPOT/.git" ]; then
            echo "Cloning depot_tools..."

            rm -rf "$DEPOT"

            git clone \
              --depth=1 \
              https://chromium.googlesource.com/chromium/tools/depot_tools.git \
              "$DEPOT"
          else
            echo "Updating cached depot_tools..."

            git -C "$DEPOT" fetch \
              --depth=1 \
              origin \
              main

            git -C "$DEPOT" reset \
              --hard \
              origin/main

            git -C "$DEPOT" clean -ffd
          fi

          echo "$DEPOT" >> "$GITHUB_PATH"
          echo "$DEPOT/python-bin" >> "$GITHUB_PATH"

          export PATH="$DEPOT:$DEPOT/python-bin:$PATH"

          echo ""
          echo "depot_tools:"
          echo "$DEPOT"

          echo ""
          echo "git:"
          git --version

          echo ""
          echo "python:"
          python3 --version

          echo ""
          echo "gclient:"
          command -v gclient
          gclient --version || true

          echo ""
          echo "fetch:"
          command -v fetch

          echo ""
          echo "autoninja:"
          command -v autoninja

          echo ""
          echo "gn wrapper:"
          command -v gn || true

          echo ""
          echo "ninja:"
          command -v ninja
          ninja --version

      # ============================================================
      # 5. FETCH ANGLE
      #
      # Do NOT cache the entire ANGLE checkout.
      #
      # A stale source/dependency cache is what caused several of
      # the previous confusing GN/depot_tools failures.
      # ============================================================

      - name: Fetch ANGLE
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$ANGLE_DIR"

          mkdir -p "$ANGLE_DIR"

          cd "$ANGLE_DIR"

          # fetch angle creates the ANGLE checkout and .gclient.
          fetch angle

      # ============================================================
      # 6. SYNC ANGLE DEPENDENCIES
      # ============================================================

      - name: Synchronize ANGLE
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANGLE_DIR"

          gclient sync \
            --no-history \
            --force \
            --reset \
            --jobs="$(sysctl -n hw.ncpu)"

      - name: Build ANGLE iOS ARM64 static libraries
        shell: bash
        env:
          ANGLE_SRC: ${{ github.workspace }}/angle-work
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " APKContainer - ANGLE iOS ARM64 STATIC BUILD"
          echo "============================================================"

          test -d "$ANGLE_SRC"
          cd "$ANGLE_SRC"

          echo "ANGLE source:"
          pwd

          echo ""
          echo "ANGLE revision:"
          git rev-parse HEAD
          git log -1 --oneline

          # ============================================================
          # TOOLCHAIN
          # ============================================================

          if [ -d "$HOME/depot_tools" ]; then
            export PATH="$HOME/depot_tools:$PATH"
          fi

          GN=""

          if command -v gn >/dev/null 2>&1; then
            GN="$(command -v gn)"
          elif [ -x "$HOME/depot_tools/gn" ]; then
            GN="$HOME/depot_tools/gn"
          fi

          if [ -z "$GN" ]; then
            echo "ERROR: GN was not found."
            echo "PATH=$PATH"
            exit 1
          fi

          if command -v autoninja >/dev/null 2>&1; then
            NINJA="autoninja"
          elif command -v ninja >/dev/null 2>&1; then
            NINJA="ninja"
          else
            echo "ERROR: ninja/autoninja was not found."
            exit 1
          fi

          command -v python3
          command -v xcrun
          command -v file
          command -v nm

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CLANG="$(xcrun --sdk iphoneos -f clang)"
          CLANGXX="$(xcrun --sdk iphoneos -f clang++)"
          AR="$(xcrun --sdk iphoneos -f ar)"
          RANLIB="$(xcrun --sdk iphoneos -f ranlib)"

          echo ""
          echo "GN:       $GN"
          echo "NINJA:    $NINJA"
          echo "SDK:      $SDK"
          echo "CLANG:    $CLANG"
          echo "CLANGXX:  $CLANGXX"
          echo "AR:       $AR"
          echo "RANLIB:   $RANLIB"

          "$GN" --version

          # ============================================================
          # SHOW THE ACTUAL ANGLE TARGETS
          # ============================================================

          echo ""
          echo "============================================================"
          echo " LOCATING ANGLE STATIC TARGETS"
          echo "============================================================"

          grep -n \
            -E \
            'angle_static_library\("libGLESv2_static"\)|static_library\("libGLESv2_static"\)|libEGL_template\("libEGL_static"\)|static_library\("libEGL_static"\)' \
            BUILD.gn \
            || true

          # ============================================================
          # PATCH ONLY THE ACTUAL GLES TARGET
          #
          # NEVER patch the global angle_static_library template with
          # complete_static_lib.
          # ============================================================

          python3 <<'PY'
          from pathlib import Path
          import re

          build = Path("BUILD.gn")
          text = build.read_text()

          def find_target(text, names):
              for name in names:
                  marker = name
                  start = text.find(marker)

                  if start < 0:
                      continue

                  brace = text.find("{", start)

                  if brace < 0:
                      raise SystemExit(
                          f"ERROR: target {marker!r} has no opening brace."
                      )

                  depth = 0
                  in_string = False
                  escape = False

                  for i in range(brace, len(text)):
                      c = text[i]

                      if in_string:
                          if escape:
                              escape = False
                          elif c == "\\":
                              escape = True
                          elif c == '"':
                              in_string = False
                          continue

                      if c == '"':
                          in_string = True
                      elif c == "{":
                          depth += 1
                      elif c == "}":
                          depth -= 1

                          if depth == 0:
                              return start, i + 1, text[start:i + 1], marker

              return None

          GLES_NAMES = [
              'angle_static_library("libGLESv2_static")',
              'static_library("libGLESv2_static")',
          ]

          EGL_NAMES = [
              'libEGL_template("libEGL_static")',
              'angle_static_library("libEGL_static")',
              'static_library("libEGL_static")',
          ]

          gles = find_target(text, GLES_NAMES)
          egl = find_target(text, EGL_NAMES)

          if gles is None:
              raise SystemExit(
                  "ERROR: Could not find libGLESv2_static in BUILD.gn."
              )

          if egl is None:
              raise SystemExit(
                  "ERROR: Could not find libEGL_static in BUILD.gn."
              )

          gs, ge, gles_block, gles_marker = gles
          es, ee, egl_block, egl_marker = egl

          print("Found GLES target:")
          print(" ", gles_marker)

          print("Found EGL target:")
          print(" ", egl_marker)

          # ------------------------------------------------------------
          # Remove accidental complete_static_lib from EGL.
          # ------------------------------------------------------------

          egl_block = re.sub(
              r'^[ \t]*complete_static_lib\s*=\s*true\s*\n',
              '',
              egl_block,
              flags=re.MULTILINE,
          )

          # ------------------------------------------------------------
          # Remove accidental complete_static_lib from GLES so this
          # operation is idempotent.
          # ------------------------------------------------------------

          gles_block = re.sub(
              r'^[ \t]*complete_static_lib\s*=\s*true\s*\n',
              '',
              gles_block,
              flags=re.MULTILINE,
          )

          # ------------------------------------------------------------
          # Insert complete_static_lib ONLY into libGLESv2_static.
          # ------------------------------------------------------------

          brace = gles_block.find("{")

          if brace < 0:
              raise SystemExit(
                  "ERROR: GLES target opening brace disappeared."
              )

          insertion = (
              "\n"
              "  # APKContainer: make the GLES archive self-contained.\n"
              "  complete_static_lib = true\n"
          )

          gles_block = (
              gles_block[:brace + 1]
              + insertion
              + gles_block[brace + 1:]
          )

          # ------------------------------------------------------------
          # Replace targets without assuming their line numbers.
          # ------------------------------------------------------------

          if gs < es:
              text = (
                  text[:es]
                  + egl_block
                  + text[ee:]
              )

              # Re-find GLES because EGL replacement changes offsets.
              gles = find_target(text, GLES_NAMES)

              if gles is None:
                  raise SystemExit(
                      "ERROR: GLES target disappeared after EGL patch."
                  )

              gs, ge, _, _ = gles

              text = (
                  text[:gs]
                  + gles_block
                  + text[ge:]
              )

          else:
              text = (
                  text[:gs]
                  + gles_block
                  + text[ge:]
              )

              egl = find_target(text, EGL_NAMES)

              if egl is None:
                  raise SystemExit(
                      "ERROR: EGL target disappeared after GLES patch."
                  )

              es, ee, _, _ = egl

              text = (
                  text[:es]
                  + egl_block
                  + text[ee:]
              )

          build.write_text(text)

          # ------------------------------------------------------------
          # FINAL TARGET-LEVEL VERIFICATION
          # ------------------------------------------------------------

          final = build.read_text()

          gles = find_target(final, GLES_NAMES)
          egl = find_target(final, EGL_NAMES)

          if gles is None or egl is None:
              raise SystemExit(
                  "ERROR: final target verification failed."
              )

          _, _, final_gles, _ = gles
          _, _, final_egl, _ = egl

          if "complete_static_lib = true" not in final_gles:
              raise SystemExit(
                  "ERROR: libGLESv2_static is not complete."
              )

          if "complete_static_lib = true" in final_egl:
              raise SystemExit(
                  "ERROR: libEGL_static must NOT be complete."
              )

          print("")
          print("TARGET PATCH VERIFIED")
          print("  libGLESv2_static: COMPLETE")
          print("  libEGL_static:    NORMAL")
          PY

          # ============================================================
          # REMOVE THIN ARCHIVE FROM THE ANGLE STATIC-LIBRARY TEMPLATE
          #
          # This is a template-level change because it controls how
          # static archives are produced.
          #
          # complete_static_lib remains TARGET-LEVEL only.
          # ============================================================

          GNI="$ANGLE_SRC/gni/angle.gni"

          python3 - "$GNI" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          marker = 'template("angle_static_library")'
          start = text.find(marker)

          if start < 0:
              raise SystemExit(
                  "ERROR: angle_static_library template was not found."
              )

          next_template = text.find(
              '\ntemplate("',
              start + len(marker),
          )

          if next_template < 0:
              next_template = len(text)

          block = text[start:next_template]

          # Remove any previous accidental complete_static_lib injection
          # from the TEMPLATE.
          new_lines = []

          for line in block.splitlines(True):
              if "complete_static_lib = true" in line:
                  continue

              new_lines.append(line)

          block = "".join(new_lines)

          thin_line = (
              '  configs -= [ "//build/config/compiler:thin_archive" ]\n'
          )

          if thin_line not in block:
              anchors = [
                  "configs -= invoker.suppressed_configs",
                  "configs += invoker.configs",
              ]

              anchor = None

              for candidate in anchors:
                  pos = block.find(candidate)

                  if pos >= 0:
                      anchor = candidate
                      break

              if anchor is None:
                  raise SystemExit(
                      "ERROR: Could not find ANGLE static-library "
                      "config insertion point."
                  )

              pos = block.find(anchor)

              line_end = block.find("\n", pos)

              if line_end < 0:
                  raise SystemExit(
                      "ERROR: static-library config line has no newline."
                  )

              block = (
                  block[:line_end + 1]
                  + thin_line
                  + block[line_end + 1:]
              )

          path.write_text(
              text[:start]
              + block
              + text[next_template:]
          )

          print("ANGLE static-library template verified.")
          print("  complete_static_lib: NOT in template")
          print("  thin_archive:       disabled")
          PY

          # ============================================================
          # VERIFY THERE IS ONLY ONE complete_static_lib AND IT IS IN
          # libGLESv2_static.
          # ============================================================

          python3 <<'PY'
          from pathlib import Path

          text = Path("BUILD.gn").read_text()

          count = text.count("complete_static_lib = true")

          if count != 1:
              raise SystemExit(
                  f"ERROR: expected exactly one complete_static_lib=true "
                  f"in BUILD.gn, found {count}."
              )

          pos = text.find("complete_static_lib = true")

          before = text[:pos]
          target = before.rfind("libGLESv2_static")

          if target < 0:
              raise SystemExit(
                  "ERROR: complete_static_lib is not associated with "
                  "libGLESv2_static."
              )

          egl = before.rfind("libEGL_static")

          if egl > target:
              raise SystemExit(
                  "ERROR: complete_static_lib appears to belong to EGL."
              )

          print("BUILD.gn complete_static_lib placement verified.")
          PY

          # ============================================================
          # GN GENERATION
          # ============================================================

          OUT="$ANGLE_SRC/out/ios-arm64"

          rm -rf "$OUT"

          "$GN" gen "$OUT" \
            --args='
              target_os = "ios"
              target_cpu = "arm64"
              target_environment = "device"

              is_debug = false
              is_component_build = false
              is_official_build = false

              ios_enable_code_signing = false
              ios_deployment_target = "18.0"

              angle_enable_metal = true
              angle_enable_vulkan = false
              angle_enable_gl = false

              use_goma = false
              use_remoteexec = false
            '

          echo ""
          echo "GN generation PASSED."

          # ============================================================
          # GN CHECK
          # ============================================================

          "$GN" check "$OUT" //:libGLESv2_static
          "$GN" check "$OUT" //:libEGL_static

          echo "GN checks PASSED."

          # ============================================================
          # BUILD
          # ============================================================

          echo ""
          echo "============================================================"
          echo " BUILD libGLESv2_static"
          echo "============================================================"

          "$NINJA" \
            -C "$OUT" \
            -j2 \
            libGLESv2_static

          echo ""
          echo "============================================================"
          echo " BUILD libEGL_static"
          echo "============================================================"

          "$NINJA" \
            -C "$OUT" \
            -j2 \
            libEGL_static

          EGL="$OUT/obj/libEGL_static.a"
          GLES="$OUT/obj/libGLESv2_static.a"

          test -f "$EGL"
          test -f "$GLES"

          # ============================================================
          # APPLE AR / RANLIB
          # ============================================================

          "$AR" -s "$EGL"
          "$AR" -s "$GLES"

          "$RANLIB" "$EGL"
          "$RANLIB" "$GLES"

          # ============================================================
          # ARCHIVE FORMAT
          # ============================================================

          echo ""
          echo "============================================================"
          echo " ARCHIVE FORMAT"
          echo "============================================================"

          EGL_FILE="$(file "$EGL")"
          GLES_FILE="$(file "$GLES")"

          echo "$EGL_FILE"
          echo "$GLES_FILE"

          if echo "$EGL_FILE" | grep -Eqi 'thin archive|thin library'; then
            echo "ERROR: EGL archive is thin."
            exit 1
          fi

          if echo "$GLES_FILE" | grep -Eqi 'thin archive|thin library'; then
            echo "ERROR: GLES archive is thin."
            exit 1
          fi

          # ============================================================
          # ARCHIVE CONTENT
          # ============================================================

          EGL_MEMBERS="$(mktemp)"
          GLES_MEMBERS="$(mktemp)"

          trap 'rm -f "$EGL_MEMBERS" "$GLES_MEMBERS"; rm -rf "$TMP_EGL" "$TMP_GLES" "$LINK_TMP"' EXIT

          "$AR" -t "$EGL" > "$EGL_MEMBERS"
          "$AR" -t "$GLES" > "$GLES_MEMBERS"

          EGL_OBJECTS="$(
            grep -E '\.o$' "$EGL_MEMBERS" |
            wc -l |
            tr -d ' '
          )"

          GLES_OBJECTS="$(
            grep -E '\.o$' "$GLES_MEMBERS" |
            wc -l |
            tr -d ' '
          )"

          echo ""
          echo "EGL object members:  $EGL_OBJECTS"
          echo "GLES object members: $GLES_OBJECTS"

          if [ "$EGL_OBJECTS" -lt 1 ]; then
            echo "ERROR: EGL archive has no object files."
            exit 1
          fi

          if [ "$GLES_OBJECTS" -lt 2 ]; then
            echo "ERROR: GLES archive still contains too few objects."
            echo ""
            echo "This means ANGLE's implementation was not collected."
            echo ""
            cat "$GLES_MEMBERS"
            exit 1
          fi

          # ============================================================
          # EXTRACT OBJECTS
          # ============================================================

          TMP_EGL="$(mktemp -d)"
          TMP_GLES="$(mktemp -d)"

          (
            cd "$TMP_EGL"
            "$AR" -x "$EGL"
          )

          (
            cd "$TMP_GLES"
            "$AR" -x "$GLES"
          )

          EGL_OBJECT_COUNT="$(
            find "$TMP_EGL" \
              -type f \
              -name '*.o' |
            wc -l |
            tr -d ' '
          )"

          GLES_OBJECT_COUNT="$(
            find "$TMP_GLES" \
              -type f \
              -name '*.o' |
            wc -l |
            tr -d ' '
          )"

          echo ""
          echo "Extracted EGL objects:  $EGL_OBJECT_COUNT"
          echo "Extracted GLES objects: $GLES_OBJECT_COUNT"

          # ============================================================
          # ARM64 VERIFICATION
          # ============================================================

          EGL_ARM64=0
          GLES_ARM64=0

          while IFS= read -r -d '' obj; do
            desc="$(file "$obj")"

            if echo "$desc" | grep -Eqi \
              'Mach-O.*arm64|Mach-O 64-bit.*arm64'; then
              EGL_ARM64=$((EGL_ARM64 + 1))
            else
              echo "ERROR: non-ARM64 EGL object:"
              echo "$desc"
              exit 1
            fi
          done < <(
            find "$TMP_EGL" \
              -type f \
              -name '*.o' \
              -print0
          )

          while IFS= read -r -d '' obj; do
            desc="$(file "$obj")"

            if echo "$desc" | grep -Eqi \
              'Mach-O.*arm64|Mach-O 64-bit.*arm64'; then
              GLES_ARM64=$((GLES_ARM64 + 1))
            else
              echo "ERROR: non-ARM64 GLES object:"
              echo "$desc"
              exit 1
            fi
          done < <(
            find "$TMP_GLES" \
              -type f \
              -name '*.o' \
              -print0
          )

          echo ""
          echo "EGL ARM64 objects:  $EGL_ARM64"
          echo "GLES ARM64 objects: $GLES_ARM64"

          [ "$EGL_ARM64" -gt 0 ]
          [ "$GLES_ARM64" -gt 0 ]

          # ============================================================
          # SYMBOL VALIDATION
          # ============================================================

          EGL_SYMBOLS="$(
            nm -gU "$EGL" 2>/dev/null |
            wc -l |
            tr -d ' '
          )"

          GLES_SYMBOLS="$(
            nm -gU "$GLES" 2>/dev/null |
            wc -l |
            tr -d ' '
          )"

          echo ""
          echo "EGL global symbols:  $EGL_SYMBOLS"
          echo "GLES global symbols: $GLES_SYMBOLS"

          [ "$EGL_SYMBOLS" -gt 0 ]
          [ "$GLES_SYMBOLS" -gt 0 ]

          # ============================================================
          # VERIFY ACTUAL GLES IMPLEMENTATION OBJECTS
          # ============================================================

          echo ""
          echo "============================================================"
          echo " GLES ARCHIVE MEMBERS"
          echo "============================================================"

          cat "$GLES_MEMBERS"

          if ! grep -Eqi \
            '(libANGLE|Context|Renderer|Program|Texture|Buffer|Surface|Display).*\.o$' \
            "$GLES_MEMBERS"
          then
            echo ""
            echo "ERROR: libGLESv2_static.a does not contain recognizable"
            echo "ANGLE implementation objects."
            exit 1
          fi

          # ============================================================
          # REAL LINK TEST
          #
          # This is the important test.
          #
          # Previous builds passed archive validation but failed here
          # because libEGL contained references to missing EGL symbols.
          # ============================================================

          echo ""
          echo "============================================================"
          echo " REAL iOS ARM64 LINK TEST"
          echo "============================================================"

          LINK_TMP="$(mktemp -d)"

          cat > "$LINK_TMP/main.mm" <<'EOF'
          #import <Foundation/Foundation.h>
          #import <Metal/Metal.h>

          #include <EGL/egl.h>
          #include <GLES2/gl2.h>

          int main() {
              @autoreleasepool {
                  EGLDisplay display = eglGetDisplay(EGL_DEFAULT_DISPLAY);
                  (void)display;

                  const GLubyte *version = glGetString(GL_VERSION);
                  (void)version;

                  id<MTLDevice> device = MTLCreateSystemDefaultDevice();
                  (void)device;
              }

              return 0;
          }
          EOF

          "$CLANGXX" \
            -arch arm64 \
            -isysroot "$SDK" \
            -mios-version-min=18.0 \
            -I"$ANGLE_SRC/include" \
            -c "$LINK_TMP/main.mm" \
            -o "$LINK_TMP/main.o"

          "$CLANGXX" \
            -arch arm64 \
            -isysroot "$SDK" \
            -mios-version-min=18.0 \
            "$LINK_TMP/main.o" \
            "$EGL" \
            "$GLES" \
            -framework Foundation \
            -framework Metal \
            -framework QuartzCore \
            -framework CoreGraphics \
            -framework UIKit \
            -framework IOSurface \
            -framework CoreFoundation \
            -o "$LINK_TMP/angle-link-test"

          test -x "$LINK_TMP/angle-link-test"

          echo ""
          echo "============================================================"
          echo " REAL iOS ARM64 LINK TEST PASSED"
          echo "============================================================"

          # ============================================================
          # COPY FINAL ARTIFACTS
          # ============================================================

          ARTIFACT_DIR="$GITHUB_WORKSPACE/angle-artifacts"

          rm -rf "$ARTIFACT_DIR"

          mkdir -p \
            "$ARTIFACT_DIR/include"

          cp \
            "$EGL" \
            "$ARTIFACT_DIR/libEGL_static.a"

          cp \
            "$GLES" \
            "$ARTIFACT_DIR/libGLESv2_static.a"

          cp -R \
            "$ANGLE_SRC/include/." \
            "$ARTIFACT_DIR/include/"

          # ============================================================
          # FINAL ARTIFACT VERIFICATION
          # ============================================================

          test -f "$ARTIFACT_DIR/libEGL_static.a"
          test -f "$ARTIFACT_DIR/libGLESv2_static.a"

          echo ""
          echo "============================================================"
          echo " FINAL ANGLE ARTIFACTS"
          echo "============================================================"

          ls -lh \
            "$ARTIFACT_DIR/libEGL_static.a" \
            "$ARTIFACT_DIR/libGLESv2_static.a"

          file \
            "$ARTIFACT_DIR/libEGL_static.a" \
            "$ARTIFACT_DIR/libGLESv2_static.a"

          echo ""
          echo "EGL:"
          echo "$ARTIFACT_DIR/libEGL_static.a"

          echo ""
          echo "GLES:"
          echo "$ARTIFACT_DIR/libGLESv2_static.a"

          echo ""
          echo "============================================================"
          echo " ANGLE iOS ARM64 BUILD SUCCESS"
          echo "============================================================"

      # ============================================================
      # 19. UPLOAD
      # ============================================================

      - name: Upload ANGLE iOS ARM64
        uses: actions/upload-artifact@v7
        with:
          name: angle-ios-arm64-metal-static
          path: angle-artifacts/
          if-no-files-found: error
          retention-days: 30
