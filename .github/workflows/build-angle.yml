      - name: Build ANGLE iOS ARM64 standalone static archives
        shell: bash
        env:
          ANGLE_SRC: ${{ github.workspace }}/angle-work
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "ANGLE iOS ARM64 STATIC BUILD"
          echo "=================================================="

          cd "$ANGLE_SRC"

          export DEPOT_TOOLS="$HOME/depot_tools"

          if [ -d "$DEPOT_TOOLS" ]; then
            export PATH="$DEPOT_TOOLS:$PATH"
          fi

          # ------------------------------------------------------------
          # Locate GN
          # ------------------------------------------------------------

          GN=""

          if command -v gn >/dev/null 2>&1; then
            GN="$(command -v gn)"
          elif [ -x "$HOME/depot_tools/gn" ]; then
            GN="$HOME/depot_tools/gn"
          else
            echo "ERROR: GN was not found."
            echo "PATH=$PATH"
            exit 1
          fi

          echo "GN: $GN"
          "$GN" --version

          # ------------------------------------------------------------
          # Locate Ninja
          # ------------------------------------------------------------

          NINJA=""

          if command -v autoninja >/dev/null 2>&1; then
            NINJA="autoninja"
          elif command -v ninja >/dev/null 2>&1; then
            NINJA="ninja"
          else
            echo "ERROR: ninja/autoninja was not found."
            exit 1
          fi

          echo "NINJA: $NINJA"

          # ------------------------------------------------------------
          # Verify Apple tools
          # ------------------------------------------------------------

          command -v xcrun
          command -v clang
          command -v ar
          command -v ranlib
          command -v file
          command -v nm

          XCODE_SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CLANG="$(xcrun --sdk iphoneos -f clang)"
          AR="$(xcrun --sdk iphoneos -f ar)"
          RANLIB="$(xcrun --sdk iphoneos -f ranlib)"

          echo "SDK:     $XCODE_SDK"
          echo "CLANG:   $CLANG"
          echo "AR:      $AR"
          echo "RANLIB:  $RANLIB"

          # ------------------------------------------------------------
          # ANGLE revision
          # ------------------------------------------------------------

          echo ""
          echo "=================================================="
          echo "ANGLE SOURCE"
          echo "=================================================="

          git rev-parse HEAD
          git log -1 --oneline

          # ------------------------------------------------------------
          # Remove previous experimental patches
          #
          # The previous custom libGLESv2_ios_complete target is NOT used.
          # We modify the actual ANGLE root static targets instead.
          # ------------------------------------------------------------

          python3 - <<'PY'
          from pathlib import Path

          p = Path("BUILD.gn")
          text = p.read_text()

          # Remove a previously injected custom target if it exists.
          start_marker = 'static_library("libGLESv2_ios_complete") {'

          start = text.find(start_marker)

          if start != -1:
              depth = 0
              end = None
              i = start

              while i < len(text):
                  c = text[i]

                  if c == "{":
                      depth += 1
                  elif c == "}":
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break

                  i += 1

              if end is None:
                  raise SystemExit(
                      "ERROR: Could not remove old libGLESv2_ios_complete target."
                  )

              # Remove the complete target and its following whitespace.
              text = text[:start] + text[end:]
              p.write_text(text)

              print("Removed old libGLESv2_ios_complete target.")
          else:
              print("No old custom target found.")

          PY

          # ------------------------------------------------------------
          # Patch the REAL ANGLE root static targets.
          #
          # libGLESv2_static:
          #   libGLESv2 implementation
          #   + libGLESv2_thin_static
          #   + libANGLE dependency tree
          #
          # libEGL_static:
          #   EGL implementation
          #   + libGLESv2_static dependency tree
          #
          # complete_static_lib makes GN put the dependency objects into
          # the resulting archive instead of leaving them as separate
          # archive dependencies.
          # ------------------------------------------------------------

          python3 - <<'PY'
          from pathlib import Path

          p = Path("BUILD.gn")
          text = p.read_text()

          def add_complete_static_lib(text, target):
              marker = f'angle_static_library("{target}") {{'

              pos = text.find(marker)

              if pos == -1:
                  raise SystemExit(
                      f"ERROR: Could not find {marker}"
                  )

              brace = text.find("{", pos)

              if brace == -1:
                  raise SystemExit(
                      f"ERROR: Could not find opening brace for {target}"
                  )

              # Find matching closing brace.
              depth = 0
              end = None

              for i in range(brace, len(text)):
                  c = text[i]

                  if c == "{":
                      depth += 1
                  elif c == "}":
                      depth -= 1

                      if depth == 0:
                          end = i
                          break

              if end is None:
                  raise SystemExit(
                      f"ERROR: Could not find end of {target}"
                  )

              block = text[pos:end + 1]

              if "complete_static_lib = true" in block:
                  print(f"{target}: complete_static_lib already present.")
                  return text

              insertion = (
                  "\n"
                  "  # APKContainer: make this a self-contained static archive.\n"
                  "  complete_static_lib = true\n"
              )

              insert_at = brace + 1

              text = (
                  text[:insert_at]
                  + insertion
                  + text[insert_at:]
              )

              print(f"{target}: added complete_static_lib = true.")

              return text

          # Current ANGLE has both of these root targets.
          text = add_complete_static_lib(
              text,
              "libGLESv2_static",
          )

          text = add_complete_static_lib(
              text,
              "libEGL_static",
          )

          p.write_text(text)

          PY

          # ------------------------------------------------------------
          # Disable thin archives inside ANGLE's static-library template.
          #
          # This is essential.
          #
          # complete_static_lib tells GN to collect dependencies, while
          # removing thin_archive makes the resulting .a contain actual
          # Mach-O object data instead of references to external objects.
          # ------------------------------------------------------------

          GNI="gni/angle.gni"

          python3 - "$GNI" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          text = p.read_text()

          marker = 'configs -= [ "//build/config/compiler:thin_archive" ]'

          if marker in text:
              print("thin_archive removal already present.")
          else:
              anchor = "configs -= invoker.suppressed_configs"

              pos = text.find(anchor)

              if pos == -1:
                  raise SystemExit(
                      "ERROR: Could not find "
                      "'configs -= invoker.suppressed_configs' "
                      "in gni/angle.gni"
                  )

              line_end = text.find("\n", pos)

              if line_end == -1:
                  raise SystemExit(
                      "ERROR: Could not find line ending."
                  )

              insertion = (
                  "\n"
                  "  # APKContainer: standalone Apple .a archives.\n"
                  "  configs -= [ \"//build/config/compiler:thin_archive\" ]"
              )

              text = (
                  text[:line_end + 1]
                  + insertion
                  + text[line_end + 1:]
              )

              p.write_text(text)

              print("Disabled thin_archive for ANGLE static libraries.")

          PY

          # ------------------------------------------------------------
          # Verify our modifications
          # ------------------------------------------------------------

          echo ""
          echo "=================================================="
          echo "VERIFY BUILD.GN"
          echo "=================================================="

          grep -n -A15 -B2 \
            'angle_static_library("libGLESv2_static")' \
            BUILD.gn

          echo ""

          grep -n -A20 -B2 \
            'angle_static_library("libEGL_static")' \
            BUILD.gn

          echo ""

          grep -n \
            'thin_archive' \
            "$GNI" || true

          echo ""
          echo "=================================================="
          echo "GN GENERATION"
          echo "=================================================="

          OUT="$ANGLE_SRC/out/ios-arm64"

          rm -rf "$OUT"

          "$GN" gen "$OUT" \
            --args='
              target_os = "ios"
              target_cpu = "arm64"

              is_debug = false
              is_component_build = false
              is_official_build = true

              angle_enable_metal = true
              angle_enable_vulkan = false

              angle_build_all = false
              angle_expose_non_conformant_extensions_and_versions = true

              use_goma = false
              use_remoteexec = false
            '

          echo ""
          echo "GN generation succeeded."

          # ------------------------------------------------------------
          # Confirm target definitions actually exist.
          # ------------------------------------------------------------

          echo ""
          echo "=================================================="
          echo "GN TARGETS"
          echo "=================================================="

          "$GN" desc "$OUT" \
            //:libEGL_static \
            label output_type

          "$GN" desc "$OUT" \
            //:libGLESv2_static \
            label output_type

          # ------------------------------------------------------------
          # Build BOTH root libraries.
          # ------------------------------------------------------------

          echo ""
          echo "=================================================="
          echo "BUILD libGLESv2_static"
          echo "=================================================="

          "$NINJA" -C "$OUT" \
            libGLESv2_static

          echo ""
          echo "=================================================="
          echo "BUILD libEGL_static"
          echo "=================================================="

          "$NINJA" -C "$OUT" \
            libEGL_static

          # ------------------------------------------------------------
          # Locate archives
          # ------------------------------------------------------------

          EGL="$OUT/obj/libEGL_static.a"
          GLES="$OUT/obj/libGLESv2_static.a"

          if [ ! -f "$EGL" ]; then
            echo "ERROR: $EGL was not generated."
            exit 1
          fi

          if [ ! -f "$GLES" ]; then
            echo "ERROR: $GLES was not generated."
            exit 1
          fi

          # ------------------------------------------------------------
          # Normalize archives with Apple's ar/ranlib.
          # ------------------------------------------------------------

          "$AR" -s "$EGL"
          "$AR" -s "$GLES"

          "$RANLIB" "$EGL"
          "$RANLIB" "$GLES"

          # ------------------------------------------------------------
          # Verify archive format
          # ------------------------------------------------------------

          echo ""
          echo "=================================================="
          echo "VERIFY ARCHIVES"
          echo "=================================================="

          file "$EGL"
          file "$GLES"

          if file "$EGL" | grep -qi "thin"; then
            echo "ERROR: libEGL_static.a is still thin."
            exit 1
          fi

          if file "$GLES" | grep -qi "thin"; then
            echo "ERROR: libGLESv2_static.a is still thin."
            exit 1
          fi

          echo "Both archives are normal Apple archives."

          # ------------------------------------------------------------
          # Size
          # ------------------------------------------------------------

          EGL_SIZE="$(stat -f%z "$EGL")"
          GLES_SIZE="$(stat -f%z "$GLES")"

          echo ""
          echo "EGL size:  $EGL_SIZE bytes"
          echo "GLES size: $GLES_SIZE bytes"

          if [ "$EGL_SIZE" -lt 4096 ]; then
            echo "ERROR: EGL archive is unexpectedly tiny."
            exit 1
          fi

          if [ "$GLES_SIZE" -lt 4096 ]; then
            echo "ERROR: GLES archive is unexpectedly tiny."
            exit 1
          fi

          # ------------------------------------------------------------
          # Member/object validation
          #
          # DO NOT require a particular number of members.
          #
          # complete_static_lib may legitimately produce different
          # member counts between ANGLE revisions.
          # ------------------------------------------------------------

          EGL_MEMBERS="$(
            "$AR" -t "$EGL" |
            grep -E '\.o$' |
            wc -l |
            tr -d ' '
          )"

          GLES_MEMBERS="$(
            "$AR" -t "$GLES" |
            grep -E '\.o$' |
            wc -l |
            tr -d ' '
          )"

          echo ""
          echo "EGL object members:  $EGL_MEMBERS"
          echo "GLES object members: $GLES_MEMBERS"

          if [ "$EGL_MEMBERS" -lt 1 ]; then
            echo "ERROR: EGL contains no object members."
            exit 1
          fi

          if [ "$GLES_MEMBERS" -lt 1 ]; then
            echo "ERROR: GLES contains no object members."
            exit 1
          fi

          # ------------------------------------------------------------
          # Extract and verify Mach-O ARM64 objects.
          # ------------------------------------------------------------

          TMP_EGL="$(mktemp -d)"
          TMP_GLES="$(mktemp -d)"

          cleanup() {
            rm -rf "$TMP_EGL" "$TMP_GLES"
          }

          trap cleanup EXIT

          (
            cd "$TMP_EGL"
            "$AR" -x "$EGL"
          )

          (
            cd "$TMP_GLES"
            "$AR" -x "$GLES"
          )

          EGL_OBJECTS=0
          GLES_OBJECTS=0
          EGL_ARM64=0
          GLES_ARM64=0

          while IFS= read -r -d '' obj; do
            EGL_OBJECTS=$((EGL_OBJECTS + 1))

            desc="$(file "$obj")"

            if echo "$desc" | grep -Eqi \
              'Mach-O.*arm64|Mach-O 64-bit.*arm64'; then
              EGL_ARM64=$((EGL_ARM64 + 1))
            else
              echo "ERROR: Non-ARM64 EGL object:"
              echo "$desc"
              exit 1
            fi
          done < <(
            find "$TMP_EGL" \
              -type f \
              -name '*.o' \
              -print0
          )

          while IFS= read -r -d '' obj; do
            GLES_OBJECTS=$((GLES_OBJECTS + 1))

            desc="$(file "$obj")"

            if echo "$desc" | grep -Eqi \
              'Mach-O.*arm64|Mach-O 64-bit.*arm64'; then
              GLES_ARM64=$((GLES_ARM64 + 1))
            else
              echo "ERROR: Non-ARM64 GLES object:"
              echo "$desc"
              exit 1
            fi
          done < <(
            find "$TMP_GLES" \
              -type f \
              -name '*.o' \
              -print0
          )

          echo ""
          echo "EGL extracted objects:  $EGL_OBJECTS"
          echo "GLES extracted objects: $GLES_OBJECTS"

          echo "EGL ARM64 objects:  $EGL_ARM64"
          echo "GLES ARM64 objects: $GLES_ARM64"

          if [ "$EGL_ARM64" -lt 1 ]; then
            echo "ERROR: No ARM64 EGL objects."
            exit 1
          fi

          if [ "$GLES_ARM64" -lt 1 ]; then
            echo "ERROR: No ARM64 GLES objects."
            exit 1
          fi

          # ------------------------------------------------------------
          # Symbols
          # ------------------------------------------------------------

          EGL_SYMBOLS="$(
            nm -gU "$EGL" 2>/dev/null |
            wc -l |
            tr -d ' '
          )"

          GLES_SYMBOLS="$(
            nm -gU "$GLES" 2>/dev/null |
            wc -l |
            tr -d ' '
          )"

          echo ""
          echo "EGL global symbols:  $EGL_SYMBOLS"
          echo "GLES global symbols: $GLES_SYMBOLS"

          if [ "$EGL_SYMBOLS" -lt 10 ]; then
            echo "ERROR: EGL archive has suspiciously few symbols."
            exit 1
          fi

          if [ "$GLES_SYMBOLS" -lt 10 ]; then
            echo "ERROR: GLES archive has suspiciously few symbols."
            exit 1
          fi

          # ------------------------------------------------------------
          # Check that the real GLES implementation exists.
          #
          # The old failure only contained libGLESv2_autogen.o.
          # A complete archive must contain ANGLE implementation objects.
          # ------------------------------------------------------------

          echo ""
          echo "=================================================="
          echo "CHECK ANGLE IMPLEMENTATION OBJECTS"
          echo "=================================================="

          "$AR" -t "$GLES" |
            grep -E '\.o$' |
            head -50

          if ! "$AR" -t "$GLES" |
            grep -Eqi \
              '(libANGLE|Context|Renderer|Program|Texture|Buffer|Surface|Display).*\.o$'
          then
            echo "WARNING: Could not identify a named ANGLE implementation object."
            echo "This is not automatically fatal because ANGLE revisions may"
            echo "rename/object-group implementation files."
          fi

          # ------------------------------------------------------------
          # Check that EGL references are resolvable from GLES.
          #
          # This is the important test that your previous build failed.
          # ------------------------------------------------------------

          echo ""
          echo "=================================================="
          echo "CHECK EGL -> GLES SYMBOL RESOLUTION"
          echo "=================================================="

          UNRESOLVED_EGL="$(
            nm -u "$EGL" 2>/dev/null |
            sed 's/^[[:space:]]*//' |
            grep '^_' |
            sort -u || true
          )"

          GLES_DEFINED="$(
            nm -gU "$GLES" 2>/dev/null |
            awk '{print $NF}' |
            sort -u
          )"

          unresolved_count=0

          while IFS= read -r sym; do
            [ -z "$sym" ] && continue

            # Ignore ordinary Apple/system symbols. The actual final link
            # test below handles those.
            if echo "$GLES_DEFINED" | grep -Fxq "$sym"; then
              continue
            fi

            case "$sym" in
              _EGL_*|_gl*|_egl*)
                unresolved_count=$((unresolved_count + 1))
                echo "EGL symbol not found in GLES archive: $sym"
                ;;
            esac
          done <<< "$UNRESOLVED_EGL"

          if [ "$unresolved_count" -ne 0 ]; then
            echo ""
            echo "ERROR: EGL -> GLES ANGLE symbols remain unresolved."
            echo "The archive is not self-contained enough."
            exit 1
          fi

          echo "EGL -> GLES ANGLE symbol resolution looks correct."

          # ------------------------------------------------------------
          # Minimal REAL iOS link test.
          #
          # Important:
          #   - use BOTH ANGLE archives
          #   - use the same iOS SDK used to build ANGLE
          #   - use the same deployment target
          #
          # Do not link against iOS 12 while ANGLE was built for iOS 18.
          # ------------------------------------------------------------

          echo ""
          echo "=================================================="
          echo "IOS STATIC LINK TEST"
          echo "=================================================="

          LINK_TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP_EGL" "$TMP_GLES" "$LINK_TMP"' EXIT

          cat > "$LINK_TMP/main.mm" <<'EOF'
          #import <Foundation/Foundation.h>
          #import <Metal/Metal.h>

          extern "C" {
          #include "EGL/egl.h"
          #include "GLES2/gl2.h"
          }

          int main() {
              @autoreleasepool {
                  EGLDisplay display = eglGetDisplay(EGL_DEFAULT_DISPLAY);

                  // We only test that the ANGLE static API is linkable.
                  // Runtime initialization is intentionally not performed
                  // in this tiny CI link test.
                  (void)display;

                  const GLubyte *version = glGetString(GL_VERSION);
                  (void)version;

                  id<MTLDevice> device = MTLCreateSystemDefaultDevice();
                  (void)device;
              }
              return 0;
          }
          EOF

          SDK_VERSION="$(
            xcrun --sdk iphoneos --show-sdk-version
          )"

          echo "iOS SDK version: $SDK_VERSION"

          "$CLANG" \
            -arch arm64 \
            -isysroot "$XCODE_SDK" \
            -mios-version-min=18.0 \
            -I"$ANGLE_SRC/include" \
            -I"$ANGLE_SRC/include/KHR" \
            -c "$LINK_TMP/main.mm" \
            -o "$LINK_TMP/main.o"

          "$CLANG" \
            -arch arm64 \
            -isysroot "$XCODE_SDK" \
            -mios-version-min=18.0 \
            "$LINK_TMP/main.o" \
            "$EGL" \
            "$GLES" \
            -framework Foundation \
            -framework Metal \
            -framework QuartzCore \
            -framework CoreGraphics \
            -framework UIKit \
            -framework IOSurface \
            -framework CoreFoundation \
            -o "$LINK_TMP/angle-link-test"

          echo ""
          echo "iOS ANGLE static link test PASSED."

          # ------------------------------------------------------------
          # Copy final artifacts into the repository workspace.
          # ------------------------------------------------------------

          ARTIFACT_DIR="$GITHUB_WORKSPACE/angle-artifacts"

          rm -rf "$ARTIFACT_DIR"
          mkdir -p "$ARTIFACT_DIR"

          cp "$EGL" \
            "$ARTIFACT_DIR/libEGL_static.a"

          cp "$GLES" \
            "$ARTIFACT_DIR/libGLESv2_static.a"

          # Headers needed by the consumer.
          mkdir -p "$ARTIFACT_DIR/include"

          cp -R \
            "$ANGLE_SRC/include/." \
            "$ARTIFACT_DIR/include/"

          # ------------------------------------------------------------
          # Final report
          # ------------------------------------------------------------

          echo ""
          echo "=================================================="
          echo "FINAL ANGLE ARTIFACTS"
          echo "=================================================="

          ls -lh \
            "$ARTIFACT_DIR/libEGL_static.a" \
            "$ARTIFACT_DIR/libGLESv2_static.a"

          file \
            "$ARTIFACT_DIR/libEGL_static.a" \
            "$ARTIFACT_DIR/libGLESv2_static.a"

          echo ""
          echo "ANGLE iOS ARM64 standalone static libraries:"
          echo "$ARTIFACT_DIR/libEGL_static.a"
          echo "$ARTIFACT_DIR/libGLESv2_static.a"

          echo ""
          echo "SUCCESS"
