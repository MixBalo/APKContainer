name: Build ANGLE (iOS / ARM64)

on:
  workflow_dispatch:

jobs:
  build-angle:
    name: Build Static Libraries
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Get Week Number for Cache Key
        id: week
        run: echo "week=$(date +%Y-%U)" >> "$GITHUB_OUTPUT"

      - name: Cache depot_tools
        uses: actions/cache@v4
        with:
          path: ~/depot_tools
          key: depot-tools-${{ runner.os }}-${{ steps.week.outputs.week }}
          restore-keys: |
            depot-tools-${{ runner.os }}-

      - name: Install depot_tools
        run: |
          if [ ! -d "$HOME/depot_tools" ]; then
            git clone --depth=1 \
              https://chromium.googlesource.com/chromium/tools/depot_tools.git \
              "$HOME/depot_tools"
          else
            echo "depot_tools restored from cache."
          fi

          echo "$HOME/depot_tools" >> "$GITHUB_PATH"

      # ------------------------------------------------------------------
      # ANGLE source
      # ------------------------------------------------------------------

      - name: Cache ANGLE Source
        id: cache-angle
        uses: actions/cache@v4
        with:
          path: angle-work
          key: angle-source-v2-${{ runner.os }}-${{ steps.week.outputs.week }}-${{ hashFiles('.github/workflows/build-angle.yml') }}
          restore-keys: |
            angle-source-v2-${{ runner.os }}-

      - name: Fetch ANGLE Source Code
        if: steps.cache-angle.outputs.cache-hit != 'true'
        run: |
          echo "ANGLE cache miss - fetching ANGLE..."

          rm -rf angle-work
          mkdir -p angle-work

          cd angle-work
          fetch angle

      - name: Sync ANGLE
        if: steps.cache-angle.outputs.cache-hit == 'true'
        run: |
          echo "ANGLE cache hit - syncing dependencies..."

          cd angle-work
          gclient sync --no-history --jobs=4

      # ------------------------------------------------------------------
      # Generate build files
      # ------------------------------------------------------------------

      - name: Generate Build Files (GN)
        run: |
          cd angle-work/src

          rm -rf out/ios

          gn gen out/ios --args='
            target_os="ios"
            target_cpu="arm64"
            target_environment="device"
            is_debug=false
            ios_enable_code_signing=false
            angle_enable_vulkan=false
            angle_enable_gl=false
            angle_enable_metal=true
            use_thin_archives=false
            complete_static_lib=true
          '

      # ------------------------------------------------------------------
      # Build
      # ------------------------------------------------------------------

      - name: Compile ANGLE
        run: |
          cd angle-work/src

          autoninja -C out/ios \
            libEGL_static \
            libGLESv2_static

      # ------------------------------------------------------------------
      # Inspect output
      # ------------------------------------------------------------------

      - name: Inspect ANGLE Static Libraries
        run: |
          cd angle-work/src/out/ios/obj

          echo "========================================"
          echo "FILE TYPES"
          echo "========================================"

          file libEGL_static.a
          file libGLESv2_static.a

          echo ""
          echo "========================================"
          echo "SIZES"
          echo "========================================"

          ls -lh libEGL_static.a
          ls -lh libGLESv2_static.a

          echo ""
          echo "========================================"
          echo "libEGL_static.a MEMBERS"
          echo "========================================"

          echo "Object count:"
          ar -t libEGL_static.a | wc -l

          echo ""
          echo "First objects:"
          ar -t libEGL_static.a | head -30

          echo ""
          echo "========================================"
          echo "libGLESv2_static.a MEMBERS"
          echo "========================================"

          echo "Object count:"
          ar -t libGLESv2_static.a | wc -l

          echo ""
          echo "First objects:"
          ar -t libGLESv2_static.a | head -30

          echo ""
          echo "========================================"
          echo "LLVM AR"
          echo "========================================"

          echo "libEGL:"
          llvm-ar -t libEGL_static.a | wc -l || true

          echo "libGLESv2:"
          llvm-ar -t libGLESv2_static.a | wc -l || true

      # ------------------------------------------------------------------
      # Inspect GN targets
      # ------------------------------------------------------------------

      - name: Inspect ANGLE Library Targets
        run: |
          cd angle-work/src

          echo "========================================"
          echo "libEGL targets"
          echo "========================================"

          gn desc out/ios | grep -iE '(^|/)libEGL|libEGL' || true

          echo ""
          echo "========================================"
          echo "libGLES targets"
          echo "========================================"

          gn desc out/ios | grep -iE '(^|/)libGLES|libGLES' || true

      # ------------------------------------------------------------------
      # Upload
      # ------------------------------------------------------------------

      - name: Upload Static Archives
        uses: actions/upload-artifact@v4
        with:
          name: angle-ios-static-libs
          path: |
            angle-work/src/out/ios/obj/libEGL_static.a
            angle-work/src/out/ios/obj/libGLESv2_static.a
          retention-days: 7
