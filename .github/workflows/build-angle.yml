name: Build ANGLE (iOS / ARM64)

on:
  workflow_dispatch:

jobs:
  build-angle:
    name: Build Static Libraries
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install depot_tools
        run: |
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git $HOME/depot_tools
          echo "$HOME/depot_tools" >> $GITHUB_PATH

      - name: Fetch ANGLE Source Code
        run: |
          mkdir -p angle-work
          cd angle-work
          fetch angle

      - name: Generate Build Files (gn)
        run: |
          cd angle-work/src
          gn gen out/ios --args='
            target_os="ios"
            target_cpu="arm64"
            target_environment="device"
            is_debug=false
            ios_enable_code_signing=false
            angle_enable_vulkan=false
            angle_enable_gl=false
            angle_enable_metal=true
            use_thin_archives=false
          '

      - name: Compile ANGLE (autoninja)
        run: |
          cd angle-work/src
          autoninja -C out/ios libEGL_static libGLESv2_static

      - name: Convert Thin Archives to Fat Archives
        run: |
          cd angle-work/src/out/ios
          mkdir -p obj/repacked
          
          # Helper function to extract and repack archives
          repack_archive() {
            local lib_name=$1
            local archive_path="obj/$lib_name.a"
            local output_path="obj/repacked/${lib_name%_static}.a"
            
            echo "==> Processing $lib_name.a..."
            
            if [ ! -f "$archive_path" ]; then
              echo "ERROR: $archive_path not found!"
              exit 1
            fi
            
            # Check if it's a thin archive
            if file "$archive_path" | grep -q "thin archive"; then
              echo "  Thin archive detected. Extracting object files..."
              
              local extract_dir="obj/extract_$lib_name"
              rm -rf "$extract_dir"
              mkdir -p "$extract_dir"
              
              # Get the list of object files in the thin archive
              local obj_list=$(ar -t "$archive_path" 2>/dev/null | grep "\.o$")
              local obj_count=$(echo "$obj_list" | wc -l)
              
              if [ "$obj_count" -eq 0 ] || [ -z "$obj_list" ]; then
                echo "  ERROR: No object files found in thin archive!"
                exit 1
              fi
              
              echo "  Found $obj_count object files"
              
              # Extract each object file using ar -p
              echo "$obj_list" | while read obj_file; do
                if [ -n "$obj_file" ]; then
                  ar -p "$archive_path" "$obj_file" > "$extract_dir/$obj_file"
                fi
              done
              
              # Verify extraction
              local extracted_count=$(ls -1 "$extract_dir"/*.o 2>/dev/null | wc -l)
              echo "  Extracted $extracted_count object files"
              
              if [ "$extracted_count" -eq 0 ]; then
                echo "  ERROR: Failed to extract any object files!"
                exit 1
              fi
              
              # Repack into a fat archive
              echo "  Repacking into fat archive..."
              ar -rcs "$output_path" "$extract_dir"/*.o
              
              # Verify result
              if ! file "$output_path" | grep -q "thin archive"; then
                local size=$(du -h "$output_path" | cut -f1)
                echo "  ✓ Successfully created fat archive ($size)"
              else
                echo "  ERROR: Output is still a thin archive!"
                exit 1
              fi
              
              rm -rf "$extract_dir"
            else
              echo "  Regular (fat) archive detected. Copying as-is..."
              cp "$archive_path" "$output_path"
              local size=$(du -h "$output_path" | cut -f1)
              echo "  ✓ Copied fat archive ($size)"
            fi
            
            echo "  Details:"
            ls -lh "$output_path"
            file "$output_path"
          }
          
          repack_archive "libEGL_static"
          repack_archive "libGLESv2_static"

      - name: Upload Fat Archives
        uses: actions/upload-artifact@v4
        with:
          name: angle-ios-static-libs
          path: angle-work/src/out/ios/obj/repacked/*.a
          retention-days: 7
