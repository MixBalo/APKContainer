name: Build ANGLE (iOS / ARM64)

on:
  workflow_dispatch:

jobs:
  build-angle:
    name: Build Static Libraries
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install depot_tools
        run: |
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git $HOME/depot_tools
          echo "$HOME/depot_tools" >> $GITHUB_PATH

      - name: Fetch ANGLE Source Code
        run: |
          mkdir -p angle-work
          cd angle-work
          fetch angle

      - name: Generate Build Files (gn)
        run: |
          cd angle-work/src
          gn gen out/ios --args='
            target_os="ios"
            target_cpu="arm64"
            target_environment="device"
            is_debug=false
            ios_enable_code_signing=false
            angle_enable_vulkan=false
            angle_enable_gl=false
            angle_enable_metal=true
            use_thin_archives=false
          '

      - name: Compile ANGLE (autoninja)
        run: |
          cd angle-work/src
          autoninja -C out/ios libEGL_static libGLESv2_static

      - name: Repack to Fat Archives
        run: |
          cd angle-work/src/out/ios/obj
          mkdir -p repacked
          
          LLVM_AR=$(xcode-select -p)/usr/bin/llvm-ar
          
          for lib in libEGL_static libGLESv2_static; do
            echo "==> Repacking $lib..."
            
            # Clean temp dir
            rm -rf "extract_$lib"
            mkdir -p "extract_$lib"
            cd "extract_$lib"
            
            # Extract every object file the thin archive references
            $LLVM_AR x "../$lib.a"
            
            # Recursively find all .o files and repack into a regular (fat) archive
            find . -type f -name "*.o" > objfiles.txt
            $LLVM_AR rcs "../repacked/${lib%_static}.a" @objfiles.txt
            
            cd ..
            rm -rf "extract_$lib"
          done
          
          echo "==> Verifying archives are NOT thin..."
          for lib in libEGL libGLESv2; do
            MAGIC=$(head -c 8 "repacked/$lib.a")
            if echo "$MAGIC" | grep -q "<thin>"; then
              echo "ERROR: repacked/$lib.a is still a thin archive!"
              exit 1
            fi
            echo "✓ repacked/$lib.a is a regular archive"
            echo "Size:"
            ls -lh "repacked/$lib.a"
            echo "Sample members:"
            $LLVM_AR t "repacked/$lib.a" | head -5
          done

      - name: Upload Fat Archives
        uses: actions/upload-artifact@v4
        with:
          name: angle-ios-static-libs
          path: angle-work/src/out/ios/obj/repacked/*.a
          retention-days: 7
