name: Build ANGLE (iOS / ARM64)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-angle:
    name: Build Static Libraries
    runs-on: macos-latest

    steps:
      # ==============================================================
      # Checkout
      # ==============================================================

      - name: Checkout Repository
        uses: actions/checkout@v6

      # ==============================================================
      # Cache key
      # ==============================================================

      - name: Get Cache Week
        id: week
        shell: bash
        run: |
          set -euo pipefail
          echo "week=$(date +%Y-%U)" >> "$GITHUB_OUTPUT"
      # ==============================================================
      # depot_tools
      # ==============================================================

      - name: Cache depot_tools
        uses: actions/cache@v5
        with:
          path: ~/depot_tools
          key: depot-tools-${{ runner.os }}-${{ steps.week.outputs.week }}
          restore-keys: |
            depot-tools-${{ runner.os }}-
      - name: Install depot_tools
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "$HOME/depot_tools" ]; then
            echo "Installing depot_tools..."
            git clone --depth=1 \
              https://chromium.googlesource.com/chromium/tools/depot_tools.git \
              "$HOME/depot_tools"
          else
            echo "depot_tools restored from cache."
          fi
          echo "$HOME/depot_tools" >> "$GITHUB_PATH"
      # ==============================================================
      # ANGLE source cache
      # ==============================================================

      - name: Cache ANGLE Source
        id: cache-angle
        uses: actions/cache@v5
        with:
          path: angle-work
          key: angle-source-v4-${{ runner.os }}-${{ steps.week.outputs.week }}-${{ hashFiles('.github/workflows/build-angle.yml') }}
          restore-keys: |
            angle-source-v4-${{ runner.os }}-
      # ==============================================================
      # Fetch ANGLE
      # ==============================================================

      - name: Fetch ANGLE Source Code
        if: steps.cache-angle.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "ANGLE cache miss."
          echo "Fetching ANGLE source..."
          rm -rf angle-work
          mkdir -p angle-work
          cd angle-work
          fetch angle
      # ==============================================================
      # Always synchronize ANGLE dependencies
      # ==============================================================

      - name: Synchronize ANGLE
        shell: bash
        run: |
          set -euo pipefail
          echo "Synchronizing ANGLE dependencies..."
          cd angle-work
          if [ ! -f ".gclient" ]; then
            echo "ERROR: .gclient was not found."
            echo "Contents of angle-work:"
            find . -maxdepth 2 -type f | head -100
            exit 1
          fi
          gclient sync --no-history --jobs=4
      # ==============================================================
      # Locate ANGLE source directory
      #
      # `fetch angle` always checks out ANGLE itself directly into
      # angle-work/ (the .gclient file and the top-level BUILD.gn live
      # right there — there is no nested angle-work/src). Earlier
      # versions of this workflow tried to *discover* the source root
      # by grepping every BUILD.gn for a literal
      #   angle_static_library("libGLESv2_static")
      # declaration. That string never appears anywhere in the tree:
      # ANGLE's root BUILD.gn only *references* ":libEGL_static" and
      # ":libGLESv2_static" as deps of group("angle_static"); the
      # actual angle_static_library() targets are generated from a
      # template/loop rather than spelled out literally. So the old
      # grep-based search always failed, even though the checkout was
      # perfectly fine.
      #
      # Fix: don't search for it — we already know where it is. Just
      # sanity-check that the expected files exist.
      # ==============================================================

      - name: Locate ANGLE Source Directory
        id: angle-source
        shell: bash
        run: |
          set -euo pipefail
          ANGLE_SRC="$GITHUB_WORKSPACE/angle-work"
          if [ ! -f "$ANGLE_SRC/.gclient" ]; then
            echo "ERROR: .gclient was not found at $ANGLE_SRC"
            echo "Contents of angle-work:"
            find "$ANGLE_SRC" -maxdepth 1 | sort
            exit 1
          fi
          if [ ! -f "$ANGLE_SRC/BUILD.gn" ]; then
            echo "ERROR: No BUILD.gn at checkout root: $ANGLE_SRC"
            exit 1
          fi
          # Confirm the angle_static group exists. It pulls in
          # libEGL_static and libGLESv2_static as deps, which is all we
          # actually need to guarantee those targets are buildable —
          # without assuming how they're spelled internally.
          if ! grep -q 'group("angle_static")' "$ANGLE_SRC/BUILD.gn"; then
            echo "ERROR: group(\"angle_static\") not found in $ANGLE_SRC/BUILD.gn"
            echo "ANGLE's BUILD.gn layout may have changed upstream; inspect manually."
            exit 1
          fi
          if ! grep -q '":libEGL_static"' "$ANGLE_SRC/BUILD.gn"; then
            echo "ERROR: \":libEGL_static\" dep not found in group(\"angle_static\")"
            exit 1
          fi
          if ! grep -q '":libGLESv2_static"' "$ANGLE_SRC/BUILD.gn"; then
            echo "ERROR: \":libGLESv2_static\" dep not found in group(\"angle_static\")"
            exit 1
          fi
          echo "ANGLE source directory:"
          echo "$ANGLE_SRC"
          echo "ANGLE_SRC=$ANGLE_SRC" >> "$GITHUB_ENV"
          echo "angle_src=$ANGLE_SRC" >> "$GITHUB_OUTPUT"
      # ==============================================================
      # Verify source
      # ==============================================================

      - name: Verify ANGLE Source
        shell: bash
        run: |
          set -euo pipefail
          echo "=================================================="
          echo "ANGLE SOURCE"
          echo "=================================================="
          echo "$ANGLE_SRC"
          echo ""
          echo "BUILD.gn:"
          ls -lh "$ANGLE_SRC/BUILD.gn"
          echo ""
          echo "ANGLE git revision:"
          git -C "$ANGLE_SRC" rev-parse HEAD || true
          echo ""
          echo "angle_static group and its static-lib deps:"
          grep -n -A6 'group("angle_static")' "$ANGLE_SRC/BUILD.gn"
      # ==============================================================
      # Patch static libraries
      #
      # complete_static_lib is a GN target property.
      #
      # Removing thin_archive from the targets is necessary because
      # the resulting .a files must contain the actual object files.
      #
      # NOTE: libEGL_static / libGLESv2_static are generated by a
      # template/loop rather than appearing as literal
      # angle_static_library("libEGL_static") { ... } blocks in
      # BUILD.gn, so we can't string-match and patch them directly the
      # way the original script assumed. Instead we patch GN's global
      # default config for static libraries via gn args (see the
      # "Generate Build Files" step below), which applies
      # complete_static_lib + removes thin_archive for every static
      # library target ANGLE builds — including these two.
      # ==============================================================

      - name: Configure Complete Static Libraries
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANGLE_SRC"
          echo "Skipping literal BUILD.gn patch — libEGL_static and"
          echo "libGLESv2_static are generated targets, not literal"
          echo "angle_static_library(\"...\") blocks. complete_static_lib"
          echo "and the thin_archive removal are applied globally via"
          echo "GN args instead (see Generate Build Files step)."
      # ==============================================================
      # Generate GN build files
      #
      # complete_static_lib = true and stripping thin_archive from
      # default_compiler_configs applies these settings to every
      # static_library target GN builds for this toolchain, which
      # covers libEGL_static / libGLESv2_static regardless of how
      # their target names are constructed internally.
      # ==============================================================

      - name: Generate Build Files
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANGLE_SRC"
          rm -rf out/ios
          gn gen out/ios --args='
            target_os="ios"
            target_cpu="arm64"
            target_environment="device"
            is_debug=false
            ios_enable_code_signing=false
            angle_enable_vulkan=false
            angle_enable_gl=false
            angle_enable_metal=true
            use_thin_archives=false
            complete_static_lib=true
          '
      # ==============================================================
      # Verify GN configuration
      # ==============================================================

      - name: Inspect GN Static Targets
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANGLE_SRC"
          echo "=================================================="
          echo "libGLESv2_static"
          echo "=================================================="
          gn desc out/ios //:libGLESv2_static
          echo ""
          echo "=================================================="
          echo "libEGL_static"
          echo "=================================================="
          gn desc out/ios //:libEGL_static
      # ==============================================================
      # Compile
      # ==============================================================

      - name: Compile ANGLE
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANGLE_SRC"
          echo "Building libEGL_static..."
          autoninja -C out/ios libEGL_static
          echo ""
          echo "Building libGLESv2_static..."
          autoninja -C out/ios libGLESv2_static
      # ==============================================================
      # Locate generated archives
      # ==============================================================

      - name: Locate Generated Libraries
        shell: bash
        run: |
          set -euo pipefail
          echo "=================================================="
          echo "Generated static archives"
          echo "=================================================="
          find "$ANGLE_SRC/out/ios" \
            -type f \
            \( \
              -name "*.a" \
              -o \
              -name "*.thin.a" \
            \) \
            -print \
            | sort
      # ==============================================================
      # Verify expected archive paths
      # ==============================================================

      - name: Verify Archive Paths
        shell: bash
        run: |
          set -euo pipefail
          EGL="$ANGLE_SRC/out/ios/obj/libEGL_static.a"
          GLES="$ANGLE_SRC/out/ios/obj/libGLESv2_static.a"
          if [ ! -f "$EGL" ]; then
            echo "ERROR: Missing:"
            echo "$EGL"
            exit 1
          fi
          if [ ! -f "$GLES" ]; then
            echo "ERROR: Missing:"
            echo "$GLES"
            exit 1
          fi
          echo "Found:"
          echo "$EGL"
          echo "$GLES"
      # ==============================================================
      # Validate final archives
      # ==============================================================

      - name: Verify Static Libraries
        shell: bash
        run: |
          set -euo pipefail
          EGL="$ANGLE_SRC/out/ios/obj/libEGL_static.a"
          GLES="$ANGLE_SRC/out/ios/obj/libGLESv2_static.a"
          echo "=================================================="
          echo "FILE TYPES"
          echo "=================================================="
          file "$EGL"
          file "$GLES"
          echo ""
          echo "=================================================="
          echo "SIZES"
          echo "=================================================="
          ls -lh "$EGL"
          ls -lh "$GLES"
          EGL_SIZE=$(stat -f%z "$EGL")
          GLES_SIZE=$(stat -f%z "$GLES")
          echo ""
          echo "libEGL_static.a: ${EGL_SIZE} bytes"
          echo "libGLESv2_static.a: ${GLES_SIZE} bytes"
          # ANGLE static libraries should be substantially larger
          # than a few KB.
          if [ "$EGL_SIZE" -lt 1000000 ]; then
            echo ""
            echo "ERROR: libEGL_static.a is suspiciously small."
            exit 1
          fi
          if [ "$GLES_SIZE" -lt 1000000 ]; then
            echo ""
            echo "ERROR: libGLESv2_static.a is suspiciously small."
            exit 1
          fi
          echo ""
          echo "=================================================="
          echo "ARCHIVE MEMBER COUNTS"
          echo "=================================================="
          EGL_COUNT=$(
            /usr/bin/ar -t "$EGL" |
            wc -l |
            tr -d ' '
          )
          GLES_COUNT=$(
            /usr/bin/ar -t "$GLES" |
            wc -l |
            tr -d ' '
          )
          echo "libEGL_static.a members: $EGL_COUNT"
          echo "libGLESv2_static.a members: $GLES_COUNT"
          if [ "$EGL_COUNT" -lt 10 ]; then
            echo ""
            echo "ERROR: libEGL_static.a contains too few objects."
            exit 1
          fi
          if [ "$GLES_COUNT" -lt 10 ]; then
            echo ""
            echo "ERROR: libGLESv2_static.a contains too few objects."
            exit 1
          fi
          echo ""
          echo "=================================================="
          echo "LLVM AR TEST"
          echo "=================================================="
          llvm-ar -t "$EGL" | head -10
          llvm-ar -t "$GLES" | head -10
          echo ""
          echo "=================================================="
          echo "ARM64 OBJECT CHECK"
          echo "=================================================="
          TMP_EGL=$(mktemp -d)
          TMP_GLES=$(mktemp -d)
          trap 'rm -rf "$TMP_EGL" "$TMP_GLES"' EXIT
          (
            cd "$TMP_EGL"
            /usr/bin/ar -x "$EGL"
          )
          (
            cd "$TMP_GLES"
            /usr/bin/ar -x "$GLES"
          )
          EGL_ARM64=0
          GLES_ARM64=0
          for obj in "$TMP_EGL"/*.o; do
            if [ -f "$obj" ]; then
              if file "$obj" | grep -qi "arm64"; then
                EGL_ARM64=$((EGL_ARM64 + 1))
              fi
            fi
          done
          for obj in "$TMP_GLES"/*.o; do
            if [ -f "$obj" ]; then
              if file "$obj" | grep -qi "arm64"; then
                GLES_ARM64=$((GLES_ARM64 + 1))
              fi
            fi
          done
          echo "ARM64 EGL objects: $EGL_ARM64"
          echo "ARM64 GLES objects: $GLES_ARM64"
          if [ "$EGL_ARM64" -eq 0 ]; then
            echo ""
            echo "ERROR: No ARM64 objects found in libEGL_static.a."
            exit 1
          fi
          if [ "$GLES_ARM64" -eq 0 ]; then
            echo ""
            echo "ERROR: No ARM64 objects found in libGLESv2_static.a."
            exit 1
          fi
          echo ""
          echo "=================================================="
          echo "STATIC LIBRARIES PASSED VALIDATION"
          echo "=================================================="
      # ==============================================================
      # Copy artifacts to a simple directory
      # ==============================================================

      - name: Prepare Artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/angle-artifacts"
          mkdir -p "$GITHUB_WORKSPACE/angle-artifacts"
          cp \
            "$ANGLE_SRC/out/ios/obj/libEGL_static.a" \
            "$GITHUB_WORKSPACE/angle-artifacts/"
          cp \
            "$ANGLE_SRC/out/ios/obj/libGLESv2_static.a" \
            "$GITHUB_WORKSPACE/angle-artifacts/"
          echo "Artifacts:"
          ls -lh "$GITHUB_WORKSPACE/angle-artifacts"
      # ==============================================================
      # Upload
      # ==============================================================

      - name: Upload Static Archives
        uses: actions/upload-artifact@v7
        with:
          name: angle-ios-arm64-static-libs
          path: angle-artifacts/
          if-no-files-found: error
          retention-days: 7
