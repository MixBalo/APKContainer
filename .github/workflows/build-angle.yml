name: Build ANGLE iOS ARM64 Static Library

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-angle:
    name: Build complete ANGLE Metal iOS ARM64
    runs-on: macos-latest

    env:
      ANGLE_DIR: ${{ github.workspace }}/angle-work
      ANGLE_OUT: ${{ github.workspace }}/angle-work/out/ios
      ARTIFACT_DIR: ${{ github.workspace }}/angle-artifacts

    steps:

      # ==============================================================
      # CHECKOUT APKContainer
      # ==============================================================

      - name: Checkout APKContainer
        uses: actions/checkout@v6

      # ==============================================================
      # CACHE DEPOT TOOLS
      # ==============================================================

      - name: Cache depot_tools
        id: cache-depot
        uses: actions/cache@v5
        with:
          path: ~/depot_tools
          key: depot-tools-${{ runner.os }}-${{ runner.arch }}-v1
          restore-keys: |
            depot-tools-${{ runner.os }}-${{ runner.arch }}-
            depot-tools-${{ runner.os }}-

      - name: Install depot_tools
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "$HOME/depot_tools" ]; then
            echo "Installing depot_tools..."

            git clone --depth=1 \
              https://chromium.googlesource.com/chromium/tools/depot_tools.git \
              "$HOME/depot_tools"
          else
            echo "Using cached depot_tools."
          fi

          echo "$HOME/depot_tools" >> "$GITHUB_PATH"

      # ==============================================================
      # CHECK TOOLCHAIN
      # ==============================================================

      - name: Verify Apple Toolchain
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "XCODE"
          echo "=================================================="

          xcodebuild -version

          echo ""
          echo "=================================================="
          echo "SDK"
          echo "=================================================="

          SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"

          echo "SDKROOT=$SDKROOT"
          echo "SDK_VERSION=$SDK_VERSION"

          echo ""
          echo "=================================================="
          echo "CLANG"
          echo "=================================================="

          xcrun --sdk iphoneos clang --version

          echo ""
          echo "=================================================="
          echo "NINJA"
          echo "=================================================="

          ninja --version

          echo ""
          echo "=================================================="
          echo "GN"
          echo "=================================================="

          gn --version

      # ==============================================================
      # FETCH A FRESH ANGLE CHECKOUT
      #
      # IMPORTANT:
      #
      # Do NOT cache angle-work itself.
      #
      # The previous workflow cached the entire ANGLE checkout,
      # which made source/build state survive between workflow runs.
      # That is particularly dangerous after modifying BUILD.gn/gni.
      # ==============================================================

      - name: Fetch ANGLE
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$ANGLE_DIR"

          mkdir -p "$ANGLE_DIR"

          cd "$ANGLE_DIR"

          fetch angle

      # ==============================================================
      # SYNCHRONIZE ANGLE
      # ==============================================================

      - name: Synchronize ANGLE dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANGLE_DIR"

          gclient sync \
            --no-history \
            --jobs=4

      # ==============================================================
      # VERIFY ANGLE CHECKOUT
      # ==============================================================

      - name: Verify ANGLE checkout
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANGLE_DIR"

          test -f BUILD.gn
          test -f gni/angle.gni
          test -f .gclient

          echo "=================================================="
          echo "ANGLE SOURCE"
          echo "=================================================="

          pwd

          echo ""
          echo "ANGLE revision:"
          git rev-parse HEAD

          echo ""
          echo "ANGLE commit:"
          git log -1 --oneline

          echo ""
          echo "Expected targets:"
          grep -n \
            -E \
            'angle_static_library\("libGLESv2_static"\)|libEGL_template\("libEGL_static"\)|group\("angle_static"\)' \
            BUILD.gn

      # ==============================================================
      # VERIFY METAL BACKEND EXISTS
      # ==============================================================

      - name: Verify ANGLE Metal backend
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANGLE_DIR"

          test -f src/libANGLE/renderer/metal/BUILD.gn

          echo "ANGLE Metal backend:"
          echo "src/libANGLE/renderer/metal/BUILD.gn"

          echo ""
          echo "Metal backend configuration:"
          grep -n \
            -E \
            'assert\(is_mac \|\| is_ios\)|assert\(angle_enable_metal\)|ldflags|Metal' \
            src/libANGLE/renderer/metal/BUILD.gn |
            head -40

      # ==============================================================
      # ADD ONE DISTRIBUTION TARGET
      #
      # THIS IS THE IMPORTANT PART.
      #
      # We do NOT modify ANGLE's existing libEGL/libGLES targets.
      #
      # Instead:
      #
      #   apkcontainer_angle
      #        |
      #        +--> libEGL_static
      #                  |
      #                  +--> libGLESv2_static
      #                            |
      #                            +--> libANGLE
      #                            +--> Metal backend
      #                            +--> translator
      #                            +--> ANGLE common
      #                            +--> other transitive dependencies
      #
      # complete_static_lib=true tells GN to flatten those dependencies
      # into THIS archive.
      # ==============================================================

      - name: Add APKContainer ANGLE distribution target
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANGLE_DIR"

          cp BUILD.gn BUILD.gn.apkcontainer-backup

          cat >> BUILD.gn <<'EOF'

          # ==============================================================
          # APKContainer ANGLE iOS distribution archive
          #
          # This is intentionally a normal GN static_library target.
          #
          # Do NOT change libEGL_static or libGLESv2_static themselves.
          #
          # complete_static_lib causes GN to collect the complete
          # transitive static dependency graph into one distributable
          # archive.
          # ==============================================================

          static_library("apkcontainer_angle_ios") {
            complete_static_lib = true

            deps = [
              ":libEGL_static",
            ]

            public_configs = [
              ":angle_static_config",
            ]
          }

          EOF

          echo "Added target:"
          echo "  //:apkcontainer_angle_ios"

          echo ""
          echo "Target definition:"
          tail -30 BUILD.gn

      # ==============================================================
      # GENERATE GN
      #
      # Keep this configuration deliberately small.
      #
      # Metal = ON
      # Vulkan = OFF
      # OpenGL backend = OFF
      # Debug = OFF
      # Component build = OFF
      # iOS device = ARM64
      # ==============================================================

      - name: Generate ANGLE GN build
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANGLE_DIR"

          rm -rf "$ANGLE_OUT"

          gn gen "$ANGLE_OUT" --args='
            target_os="ios"
            target_cpu="arm64"
            target_environment="device"

            is_debug=false
            is_component_build=false
            is_official_build=false

            ios_enable_code_signing=false

            angle_enable_metal=true
            angle_enable_vulkan=false
            angle_enable_gl=false

            use_thin_archives=false
          '

      # ==============================================================
      # VERIFY GN TARGET
      # ==============================================================

      - name: Verify distribution target
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANGLE_DIR"

          echo "=================================================="
          echo "GN TARGET"
          echo "=================================================="

          gn desc \
            "$ANGLE_OUT" \
            //:apkcontainer_angle_ios

          echo ""
          echo "=================================================="
          echo "DEPENDENCY GRAPH"
          echo "=================================================="

          gn desc \
            "$ANGLE_OUT" \
            //:apkcontainer_angle_ios \
            deps \
            --tree |
            head -300

      # ==============================================================
      # BUILD COMPLETE ARCHIVE
      # ==============================================================

      - name: Build complete ANGLE archive
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANGLE_DIR"

          echo "=================================================="
          echo "BUILDING COMPLETE ANGLE"
          echo "=================================================="

          autoninja \
            -C "$ANGLE_OUT" \
            apkcontainer_angle_ios

      # ==============================================================
      # LOCATE ARCHIVE
      # ==============================================================

      - name: Locate ANGLE archive
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "GENERATED ARCHIVES"
          echo "=================================================="

          find "$ANGLE_OUT" \
            -type f \
            \( \
              -name "*.a" \
              -o \
              -name "*.thin.a" \
            \) \
            -print |
            sort

          echo ""
          echo "Expected distribution archive:"

          find "$ANGLE_OUT" \
            -type f \
            -name "libapkcontainer_angle_ios.a" \
            -print

      # ==============================================================
      # VERIFY ARCHIVE EXISTS
      # ==============================================================

      - name: Verify ANGLE archive
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="$ANGLE_OUT/obj/libapkcontainer_angle_ios.a"

          if [ ! -f "$ARCHIVE" ]; then
            echo "ERROR: Complete ANGLE archive was not generated."

            echo ""
            echo "Searching for possible location:"

            find "$ANGLE_OUT" \
              -type f \
              -name "*apkcontainer*angle*.a" \
              -print

            exit 1
          fi

          echo "ANGLE archive:"
          echo "$ARCHIVE"

      # ==============================================================
      # FILE TYPE
      # ==============================================================

      - name: Verify archive format
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="$ANGLE_OUT/obj/libapkcontainer_angle_ios.a"

          echo "=================================================="
          echo "FILE TYPE"
          echo "=================================================="

          file "$ARCHIVE"

          DESCRIPTION="$(file "$ARCHIVE")"

          if echo "$DESCRIPTION" | grep -qi "thin archive"; then
            echo "ERROR: Archive is a thin archive."
            exit 1
          fi

          if ! echo "$DESCRIPTION" | grep -qi "ar archive"; then
            echo "ERROR: Archive is not an Apple ar archive."
            exit 1
          fi

          echo ""
          echo "Archive is a normal non-thin ar archive."

      # ==============================================================
      # SIZE
      #
      # NO ARBITRARY 1 MB / 10 OBJECT TEST.
      #
      # The real validation is the object/symbol/architecture checks
      # below.
      # ==============================================================

      - name: Inspect archive
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="$ANGLE_OUT/obj/libapkcontainer_angle_ios.a"

          SIZE="$(stat -f%z "$ARCHIVE")"

          echo "=================================================="
          echo "ARCHIVE SIZE"
          echo "=================================================="

          ls -lh "$ARCHIVE"

          echo ""
          echo "Size: $SIZE bytes"

          if [ "$SIZE" -lt 4096 ]; then
            echo "ERROR: Archive is unexpectedly tiny."
            exit 1
          fi

      # ==============================================================
      # ARCHIVE MEMBERS
      # ==============================================================

      - name: Verify archive members
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="$ANGLE_OUT/obj/libapkcontainer_angle_ios.a"

          echo "=================================================="
          echo "ARCHIVE MEMBERS"
          echo "=================================================="

          /usr/bin/ar -t "$ARCHIVE" |
            head -100

          echo ""
          echo "Total members:"

          /usr/bin/ar -t "$ARCHIVE" |
            wc -l |
            tr -d ' '

          echo ""
          echo "Object members:"

          OBJECT_COUNT=$(
            /usr/bin/ar -t "$ARCHIVE" |
              grep -E '\.o$' |
              wc -l |
              tr -d ' '
          )

          echo "$OBJECT_COUNT"

          if [ "$OBJECT_COUNT" -lt 10 ]; then
            echo ""
            echo "ERROR: Complete ANGLE archive contains fewer than 10 object files."
            echo "This indicates the dependency closure was NOT flattened."
            exit 1
          fi

      # ==============================================================
      # EXTRACT OBJECTS
      # ==============================================================

      - name: Extract ANGLE objects
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="$ANGLE_OUT/obj/libapkcontainer_angle_ios.a"

          TMP="$RUNNER_TEMP/angle-object-check"

          rm -rf "$TMP"
          mkdir -p "$TMP"

          cd "$TMP"

          /usr/bin/ar -x "$ARCHIVE"

          echo "Extracted objects:"
          find "$TMP" \
            -type f \
            -name "*.o" |
            wc -l |
            tr -d ' '

      # ==============================================================
      # ARM64 MACH-O VALIDATION
      # ==============================================================

      - name: Verify ARM64 Mach-O objects
        shell: bash
        run: |
          set -euo pipefail

          TMP="$RUNNER_TEMP/angle-object-check"

          ARM64=0
          NON_ARM64=0

          while IFS= read -r -d '' OBJECT; do

            DESCRIPTION="$(file "$OBJECT")"

            if echo "$DESCRIPTION" |
              grep -Eqi \
                'Mach-O.*arm64|Mach-O 64-bit.*arm64'; then

              ARM64=$((ARM64 + 1))

            else

              NON_ARM64=$((NON_ARM64 + 1))

              echo "WARNING: non-arm64 object:"
              echo "$DESCRIPTION"

            fi

          done < <(
            find "$TMP" \
              -type f \
              -name "*.o" \
              -print0
          )

          echo ""
          echo "ARM64 objects:     $ARM64"
          echo "Non-ARM64 objects: $NON_ARM64"

          if [ "$ARM64" -eq 0 ]; then
            echo "ERROR: No ARM64 Mach-O objects found."
            exit 1
          fi

          if [ "$NON_ARM64" -ne 0 ]; then
            echo "ERROR: Archive contains non-ARM64 objects."
            exit 1
          fi

      # ==============================================================
      # SYMBOL VALIDATION
      # ==============================================================

      - name: Verify ANGLE symbols
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="$ANGLE_OUT/obj/libapkcontainer_angle_ios.a"

          echo "=================================================="
          echo "GLOBAL SYMBOLS"
          echo "=================================================="

          SYMBOL_COUNT=$(
            nm -gU "$ARCHIVE" 2>/dev/null |
              wc -l |
              tr -d ' '
          )

          echo "Global symbols: $SYMBOL_COUNT"

          if [ "$SYMBOL_COUNT" -lt 100 ]; then
            echo "ERROR: Too few global symbols."
            exit 1
          fi

          echo ""
          echo "ANGLE/EGL/GLES symbols:"

          nm -gU "$ARCHIVE" 2>/dev/null |
            grep -E \
              'eglInitialize|eglGetDisplay|eglChooseConfig|glClear|glDrawArrays|glBindTexture|glCreateShader' |
            head -50 || true

      # ==============================================================
      # VERIFY METAL SYMBOLS / OBJECTS
      # ==============================================================

      - name: Verify Metal backend is present
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="$ANGLE_OUT/obj/libapkcontainer_angle_ios.a"

          echo "=================================================="
          echo "METAL CONTENT"
          echo "=================================================="

          /usr/bin/ar -t "$ARCHIVE" |
            grep -Ei \
              'metal|renderer|context|display' |
            head -100 || true

          echo ""
          echo "Metal strings:"

          strings "$ARCHIVE" |
            grep -E \
              'ANGLE_ENABLE_METAL|MTLDevice|MTLCommandQueue|Metal' |
            head -50 || true

      # ==============================================================
      # APPLE AR VALIDATION
      # ==============================================================

      - name: Validate with Apple ar
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="$ANGLE_OUT/obj/libapkcontainer_angle_ios.a"

          echo "=================================================="
          echo "APPLE AR"
          echo "=================================================="

          /usr/bin/ar -t "$ARCHIVE" >/dev/null

          echo "Apple ar successfully opened the complete ANGLE archive."

      # ==============================================================
      # VERIFY SYMBOLS CAN BE USED BY APPLE LINKER
      #
      # We don't link an executable here because APKContainer supplies
      # its own final application objects.
      #
      # Instead, verify the archive contains real arm64 Mach-O objects
      # and that Apple's nm can read the archive.
      # ==============================================================

      - name: Apple linker compatibility check
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="$ANGLE_OUT/obj/libapkcontainer_angle_ios.a"

          echo "=================================================="
          echo "APPLE TOOLCHAIN COMPATIBILITY"
          echo "=================================================="

          xcrun --sdk iphoneos nm -arch arm64 -gU "$ARCHIVE" |
            head -20

          echo ""
          echo "Apple nm successfully processed the ARM64 archive."

      # ==============================================================
      # PREPARE DISTRIBUTION
      # ==============================================================

      - name: Prepare ANGLE artifact
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="$ANGLE_OUT/obj/libapkcontainer_angle_ios.a"

          rm -rf "$ARTIFACT_DIR"

          mkdir -p "$ARTIFACT_DIR/include"

          cp \
            "$ARCHIVE" \
            "$ARTIFACT_DIR/libANGLE_iOS_arm64.a"

          cp -R \
            "$ANGLE_DIR/include/EGL" \
            "$ARTIFACT_DIR/include/"

          cp -R \
            "$ANGLE_DIR/include/GLES2" \
            "$ARTIFACT_DIR/include/"

          cp -R \
            "$ANGLE_DIR/include/GLES3" \
            "$ARTIFACT_DIR/include/"

          cp -R \
            "$ANGLE_DIR/include/KHR" \
            "$ARTIFACT_DIR/include/"

          echo "=================================================="
          echo "DISTRIBUTION"
          echo "=================================================="

          find "$ARTIFACT_DIR" \
            -maxdepth 3 \
            -type f \
            -print |
            sort

          echo ""
          ls -lh \
            "$ARTIFACT_DIR/libANGLE_iOS_arm64.a"

      # ==============================================================
      # BUILD MANIFEST
      # ==============================================================

      - name: Write ANGLE manifest
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="$ARTIFACT_DIR/libANGLE_iOS_arm64.a"

          cat > "$ARTIFACT_DIR/ANGLE_BUILD.txt" <<EOF
          APKContainer ANGLE iOS ARM64

          ANGLE revision:
          $(git -C "$ANGLE_DIR" rev-parse HEAD)

          ANGLE commit:
          $(git -C "$ANGLE_DIR" log -1 --oneline)

          Target:
          //:apkcontainer_angle_ios

          Platform:
          iOS device

          Architecture:
          arm64

          Backend:
          Metal

          Vulkan:
          disabled

          Desktop OpenGL:
          disabled

          Debug:
          disabled

          Component build:
          disabled

          Archive:
          libANGLE_iOS_arm64.a

          Size:
          $(stat -f%z "$ARCHIVE") bytes

          Object count:
          $(/usr/bin/ar -t "$ARCHIVE" | grep -E '\.o$' | wc -l | tr -d ' ')

          Global symbols:
          $(nm -gU "$ARCHIVE" 2>/dev/null | wc -l | tr -d ' ')

          Apple ar:
          PASS

          Apple nm:
          PASS

          ARM64 Mach-O:
          PASS
          EOF

          cat "$ARTIFACT_DIR/ANGLE_BUILD.txt"

      # ==============================================================
      # FINAL RESULT
      # ==============================================================

      - name: Final validation
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="$ARTIFACT_DIR/libANGLE_iOS_arm64.a"

          test -f "$ARCHIVE"

          echo ""
          echo "=================================================="
          echo "ANGLE iOS ARM64 STATIC LIBRARY READY"
          echo "=================================================="
          echo ""

          echo "FILE:"
          echo "$ARCHIVE"

          echo ""
          echo "SIZE:"
          stat -f%z "$ARCHIVE"

          echo ""
          echo "OBJECTS:"
          /usr/bin/ar -t "$ARCHIVE" |
            grep -E '\.o$' |
            wc -l |
            tr -d ' '

          echo ""
          echo "STATUS:"
          echo "ANGLE iOS ARM64 Metal static archive PASSED validation."

      # ==============================================================
      # UPLOAD
      # ==============================================================

      - name: Upload ANGLE iOS ARM64 library
        uses: actions/upload-artifact@v7
        with:
          name: angle-ios-arm64
          path: angle-artifacts/
          if-no-files-found: error
          retention-days: 14
