name: Build ANGLE iOS ARM64 Static Libraries

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-angle.yml"

permissions:
  contents: read

jobs:
  build-angle:
    name: Build ANGLE - iOS arm64
    runs-on: macos-latest

    env:
      ANGLE_DIR: ${{ github.workspace }}/angle-work
      OUT_DIR: ${{ github.workspace }}/angle-work/out/ios-arm64
      ARTIFACT_DIR: ${{ github.workspace }}/angle-artifacts

    steps:
      # ============================================================
      # 1. CHECKOUT APKContainer
      # ============================================================

      - name: Checkout APKContainer
        uses: actions/checkout@v6

      # ============================================================
      # 2. XCODE
      # ============================================================

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail

          echo "Available Xcodes:"
          ls -1 /Applications | grep '^Xcode' || true

          # macos-latest normally already has a suitable Xcode.
          # Do not hard-code a version that may disappear from the runner.
          if [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi

          echo "Xcode:"
          xcodebuild -version

          echo "Developer directory:"
          xcode-select -p

      - name: Accept Xcode License
        shell: bash
        run: |
          set -euo pipefail
          sudo xcodebuild -license accept

      - name: Verify iOS SDK
        shell: bash
        run: |
          set -euo pipefail

          IOS_SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          IOS_SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"

          echo "iOS SDK:"
          echo "$IOS_SDK"

          echo "iOS SDK version:"
          echo "$IOS_SDK_VERSION"

          test -d "$IOS_SDK"

      # ============================================================
      # 3. TOOLCHAIN
      # ============================================================

      - name: Verify Apple Toolchain
        shell: bash
        run: |
          set -euo pipefail

          echo "clang:"
          xcrun --sdk iphoneos clang --version

          echo ""
          echo "clang++:"
          xcrun --sdk iphoneos clang++ --version

          echo ""
          echo "ar:"
          xcrun --sdk iphoneos -f ar

          echo ""
          echo "ranlib:"
          xcrun --sdk iphoneos -f ranlib

          echo ""
          echo "nm:"
          xcrun --sdk iphoneos -f nm

          echo ""
          echo "lipo:"
          xcrun --sdk iphoneos -f lipo

          echo ""
          echo "ninja:"
          ninja --version || true

      # ============================================================
      # 4. DEPOT TOOLS
      # ============================================================

      - name: Cache depot_tools
        uses: actions/cache@v5
        with:
          path: ~/depot_tools
          key: depot-tools-${{ runner.os }}-v2
          restore-keys: |
            depot-tools-${{ runner.os }}-

      - name: Install / Update depot_tools
        shell: bash
        run: |
          set -euo pipefail

          DEPOT="$HOME/depot_tools"

          if [ ! -d "$DEPOT/.git" ]; then
            echo "Cloning depot_tools..."

            rm -rf "$DEPOT"

            git clone \
              --depth=1 \
              https://chromium.googlesource.com/chromium/tools/depot_tools.git \
              "$DEPOT"
          else
            echo "Updating cached depot_tools..."

            git -C "$DEPOT" fetch \
              --depth=1 \
              origin \
              main

            git -C "$DEPOT" reset \
              --hard \
              origin/main

            git -C "$DEPOT" clean -ffd
          fi

          echo "$DEPOT" >> "$GITHUB_PATH"
          echo "$DEPOT/python-bin" >> "$GITHUB_PATH"

          export PATH="$DEPOT:$DEPOT/python-bin:$PATH"

          echo ""
          echo "depot_tools:"
          echo "$DEPOT"

          echo ""
          echo "git:"
          git --version

          echo ""
          echo "python:"
          python3 --version

          echo ""
          echo "gclient:"
          command -v gclient
          gclient --version || true

          echo ""
          echo "fetch:"
          command -v fetch

          echo ""
          echo "autoninja:"
          command -v autoninja

          echo ""
          echo "gn wrapper:"
          command -v gn || true

          echo ""
          echo "ninja:"
          command -v ninja
          ninja --version

      # ============================================================
      # 5. FETCH ANGLE
      #
      # Do NOT cache the entire ANGLE checkout.
      #
      # A stale source/dependency cache is what caused several of
      # the previous confusing GN/depot_tools failures.
      # ============================================================

      - name: Fetch ANGLE
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$ANGLE_DIR"

          mkdir -p "$ANGLE_DIR"

          cd "$ANGLE_DIR"

          # fetch angle creates the ANGLE checkout and .gclient.
          fetch angle

      # ============================================================
      # 6. SYNC ANGLE DEPENDENCIES
      # ============================================================

      - name: Synchronize ANGLE
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANGLE_DIR"

          gclient sync \
            --no-history \
            --force \
            --reset \
            --jobs="$(sysctl -n hw.ncpu)"

      # ============================================================
      # 7. VERIFY ANGLE CHECKOUT
      # ============================================================

      - name: Verify ANGLE Checkout
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANGLE_DIR"

          test -f ".gclient"
          test -f "BUILD.gn"
          test -f "DEPS"

          echo "ANGLE:"
          git rev-parse HEAD

          echo ""
          git log -1 --oneline

          echo ""
          echo "ANGLE directory:"
          pwd

          echo ""
          echo "ANGLE files:"
          ls -la | head -50

      # ============================================================
      # 8. LOCATE GN
      #
      # Current depot_tools gn.py first looks for:
      #
      #   ANGLE/third_party/gn/gn
      #
      # This avoids the previous:
      #
      #   gn.py: Unable to find gn in your $PATH
      #
      # failure.
      # ============================================================

      - name: Locate GN
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANGLE_DIR"

          echo "=================================================="
          echo "LOCATING GN"
          echo "=================================================="

          GN=""

          # Current ANGLE/depot_tools layout.
          if [ -x "$ANGLE_DIR/third_party/gn/gn" ]; then
            GN="$ANGLE_DIR/third_party/gn/gn"
          fi

          # Some checkouts use buildtools.
          if [ -z "$GN" ] && [ -x "$ANGLE_DIR/buildtools/mac/gn" ]; then
            GN="$ANGLE_DIR/buildtools/mac/gn"
          fi

          if [ -z "$GN" ] && [ -x "$ANGLE_DIR/buildtools/mac/gn/gn" ]; then
            GN="$ANGLE_DIR/buildtools/mac/gn/gn"
          fi

          # depot_tools PATH fallback.
          if [ -z "$GN" ]; then
            if command -v gn >/dev/null 2>&1; then
              GN="$(command -v gn)"
            fi
          fi

          if [ -z "$GN" ]; then
            echo "ERROR: GN executable could not be found."
            echo ""
            echo "Searching checkout:"
            find "$ANGLE_DIR" \
              -type f \
              \( -name gn -o -name gn.exe \) \
              -print 2>/dev/null | head -100
            exit 1
          fi

          chmod +x "$GN"

          echo "GN:"
          echo "$GN"

          echo ""
          echo "GN version:"
          "$GN" --version

          echo ""
          echo "GN file:"
          file "$GN"

          echo "ANGLE_GN=$GN" >> "$GITHUB_ENV"

      # ============================================================
      # 9. VERIFY TARGETS
      # ============================================================

      - name: Verify ANGLE Static Targets
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANGLE_DIR"

          echo "=================================================="
          echo "STATIC TARGETS"
          echo "=================================================="

          grep -n \
            -E \
            'angle_static_library\("libGLESv2_static"\)|libEGL_template\("libEGL_static"\)|group\("angle_static"\)' \
            BUILD.gn

          echo ""
          echo "ANGLE static group:"
          grep -n -A12 \
            'group("angle_static")' \
            BUILD.gn

          echo ""
          echo "GLES target:"
          grep -n -A20 \
            'angle_static_library("libGLESv2_static")' \
            BUILD.gn | head -30

          echo ""
          echo "EGL target:"
          grep -n -A20 \
            'libEGL_template("libEGL_static")' \
            BUILD.gn | head -30

      # ============================================================
      # 10. NO BUILD.GN PATCHING
      #
      # IMPORTANT:
      #
      # We do not modify ANGLE's static-library template.
      #
      # ANGLE's generated static libraries may legitimately contain
      # one jumbo/autogen object. That is not evidence of a broken
      # archive.
      #
      # libEGL_static.a is expected to be much smaller than the
      # actual GLES implementation because libEGL is the EGL front
      # end and libGLESv2_static contains the actual GLES/ANGLE
      # implementation.
      # ============================================================

      - name: Verify No ANGLE Source Patch Required
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANGLE_DIR"

          echo "Using upstream ANGLE build files unchanged."

          git status --short

      # ============================================================
      # 11. GENERATE GN FILES
      #
      # Metal only.
      #
      # iOS device.
      #
      # ARM64.
      # ============================================================

      - name: Generate iOS ARM64 Build
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANGLE_DIR"

          rm -rf "$OUT_DIR"

          IOS_SDK="$(xcrun --sdk iphoneos --show-sdk-path)"

          echo "Generating:"
          echo "$OUT_DIR"

          "$ANGLE_GN" gen "$OUT_DIR" --args='
            target_os="ios"
            target_cpu="arm64"
            target_environment="device"

            is_debug=false
            is_component_build=false
            is_clang=true

            use_system_xcode=true
            ios_enable_code_signing=false

            angle_enable_metal=true
            angle_enable_vulkan=false
            angle_enable_gl=false
            angle_enable_null=false
            angle_enable_wgpu=false

            angle_enable_essl=true
            angle_enable_glsl=true

            use_thin_archives=false

            symbol_level=0
            blink_symbol_level=0

            enable_nacl=false
            use_lld=false
          '

      # ============================================================
      # 12. INSPECT GN CONFIGURATION
      # ============================================================

      - name: Inspect GN Configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANGLE_DIR"

          echo "=================================================="
          echo "GN ARGS"
          echo "=================================================="

          "$ANGLE_GN" args "$OUT_DIR" --list | \
            grep -E \
              'target_os|target_cpu|target_environment|is_debug|is_component_build|angle_enable_metal|angle_enable_vulkan|angle_enable_gl|use_thin_archives' \
              || true

          echo ""
          echo "=================================================="
          echo "GN TARGETS"
          echo "=================================================="

          "$ANGLE_GN" desc \
            "$OUT_DIR" \
            //:libEGL_static

          echo ""

          "$ANGLE_GN" desc \
            "$OUT_DIR" \
            //:libGLESv2_static

      # ============================================================
      # 13. BUILD BOTH STATIC LIBRARIES
      # ============================================================

      - name: Build ANGLE Static Libraries
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANGLE_DIR"

          echo "=================================================="
          echo "BUILD libGLESv2_static"
          echo "=================================================="

          autoninja \
            -C "$OUT_DIR" \
            libGLESv2_static

          echo ""
          echo "=================================================="
          echo "BUILD libEGL_static"
          echo "=================================================="

          autoninja \
            -C "$OUT_DIR" \
            libEGL_static

      # ============================================================
      # 14. LOCATE ARCHIVES
      # ============================================================

      - name: Locate Generated Archives
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "GENERATED ARCHIVES"
          echo "=================================================="

          find "$OUT_DIR" \
            -type f \
            \( \
              -name "libEGL_static.a" \
              -o \
              -name "libGLESv2_static.a" \
            \) \
            -print \
            | sort

      # ============================================================
      # 15. VERIFY ARCHIVES
      #
      # NO arbitrary MB threshold.
      # NO arbitrary object-count threshold.
      # NO llvm-ar dependency.
      # ============================================================

      - name: Validate Static Archives
        shell: bash
        run: |
          set -euo pipefail

          EGL="$OUT_DIR/obj/libEGL_static.a"
          GLES="$OUT_DIR/obj/libGLESv2_static.a"

          test -f "$EGL"
          test -f "$GLES"

          echo "=================================================="
          echo "ARCHIVE PATHS"
          echo "=================================================="

          echo "EGL:"
          echo "$EGL"

          echo ""
          echo "GLES:"
          echo "$GLES"

          echo ""
          echo "=================================================="
          echo "FILE TYPES"
          echo "=================================================="

          EGL_FILE="$(file "$EGL")"
          GLES_FILE="$(file "$GLES")"

          echo "$EGL_FILE"
          echo "$GLES_FILE"

          echo ""
          echo "=================================================="
          echo "THIN ARCHIVE CHECK"
          echo "=================================================="

          if echo "$EGL_FILE" | grep -qi "thin archive"; then
            echo "ERROR: EGL archive is thin."
            exit 1
          fi

          if echo "$GLES_FILE" | grep -qi "thin archive"; then
            echo "ERROR: GLES archive is thin."
            exit 1
          fi

          echo "Both archives are normal Apple ar archives."

          echo ""
          echo "=================================================="
          echo "SIZES"
          echo "=================================================="

          EGL_SIZE="$(stat -f%z "$EGL")"
          GLES_SIZE="$(stat -f%z "$GLES")"

          echo "EGL:  $EGL_SIZE bytes"
          echo "GLES: $GLES_SIZE bytes"

          # Only reject genuinely empty archives.
          if [ "$EGL_SIZE" -le 1024 ]; then
            echo "ERROR: EGL archive is effectively empty."
            exit 1
          fi

          if [ "$GLES_SIZE" -le 1024 ]; then
            echo "ERROR: GLES archive is effectively empty."
            exit 1
          fi

          echo ""
          echo "=================================================="
          echo "APPLE AR"
          echo "=================================================="

          AR="$(xcrun --sdk iphoneos -f ar)"
          RANLIB="$(xcrun --sdk iphoneos -f ranlib)"
          NM="$(xcrun --sdk iphoneos -f nm)"

          "$AR" -t "$EGL"
          echo ""
          "$AR" -t "$GLES"

          echo ""
          echo "Running ranlib:"
          "$RANLIB" -t "$EGL" || true
          "$RANLIB" -t "$GLES" || true

          echo ""
          echo "=================================================="
          echo "OBJECT COUNTS"
          echo "=================================================="

          EGL_OBJECTS="$(
            "$AR" -t "$EGL" |
            grep -E '\.o$' |
            wc -l |
            tr -d ' '
          )"

          GLES_OBJECTS="$(
            "$AR" -t "$GLES" |
            grep -E '\.o$' |
            wc -l |
            tr -d ' '
          )"

          echo "EGL object members:  $EGL_OBJECTS"
          echo "GLES object members: $GLES_OBJECTS"

          if [ "$EGL_OBJECTS" -lt 1 ]; then
            echo "ERROR: EGL contains no object members."
            exit 1
          fi

          if [ "$GLES_OBJECTS" -lt 1 ]; then
            echo "ERROR: GLES contains no object members."
            exit 1
          fi

          echo ""
          echo "=================================================="
          echo "EXTRACT OBJECTS"
          echo "=================================================="

          TMP_EGL="$(mktemp -d)"
          TMP_GLES="$(mktemp -d)"

          cleanup() {
            rm -rf "$TMP_EGL" "$TMP_GLES"
          }

          trap cleanup EXIT

          (
            cd "$TMP_EGL"
            "$AR" -x "$EGL"
          )

          (
            cd "$TMP_GLES"
            "$AR" -x "$GLES"
          )

          EGL_REAL_OBJECTS="$(
            find "$TMP_EGL" \
              -type f \
              -name '*.o' |
              wc -l |
              tr -d ' '
          )"

          GLES_REAL_OBJECTS="$(
            find "$TMP_GLES" \
              -type f \
              -name '*.o' |
              wc -l |
              tr -d ' '
          )"

          echo "Extracted EGL objects:  $EGL_REAL_OBJECTS"
          echo "Extracted GLES objects: $GLES_REAL_OBJECTS"

          if [ "$EGL_REAL_OBJECTS" -lt 1 ]; then
            echo "ERROR: No EGL object extracted."
            exit 1
          fi

          if [ "$GLES_REAL_OBJECTS" -lt 1 ]; then
            echo "ERROR: No GLES object extracted."
            exit 1
          fi

          echo ""
          echo "=================================================="
          echo "MACH-O ARCHITECTURE"
          echo "=================================================="

          EGL_ARM64=0
          GLES_ARM64=0

          while IFS= read -r -d '' obj; do
            DESC="$(file "$obj")"

            echo "$DESC"

            if echo "$DESC" | grep -Eqi \
              'Mach-O.*arm64|Mach-O 64-bit.*arm64'; then
              EGL_ARM64=$((EGL_ARM64 + 1))
            fi
          done < <(
            find "$TMP_EGL" \
              -type f \
              -name '*.o' \
              -print0
          )

          while IFS= read -r -d '' obj; do
            DESC="$(file "$obj")"

            echo "$DESC"

            if echo "$DESC" | grep -Eqi \
              'Mach-O.*arm64|Mach-O 64-bit.*arm64'; then
              GLES_ARM64=$((GLES_ARM64 + 1))
            fi
          done < <(
            find "$TMP_GLES" \
              -type f \
              -name '*.o' \
              -print0
          )

          echo ""
          echo "EGL ARM64 objects:  $EGL_ARM64"
          echo "GLES ARM64 objects: $GLES_ARM64"

          if [ "$EGL_ARM64" -lt 1 ]; then
            echo "ERROR: EGL contains no ARM64 Mach-O object."
            exit 1
          fi

          if [ "$GLES_ARM64" -lt 1 ]; then
            echo "ERROR: GLES contains no ARM64 Mach-O object."
            exit 1
          fi

          echo ""
          echo "=================================================="
          echo "SYMBOL VALIDATION"
          echo "=================================================="

          EGL_SYMBOLS="$(
            "$NM" -gU "$EGL" 2>/dev/null |
            wc -l |
            tr -d ' '
          )"

          GLES_SYMBOLS="$(
            "$NM" -gU "$GLES" 2>/dev/null |
            wc -l |
            tr -d ' '
          )"

          echo "EGL global symbols:  $EGL_SYMBOLS"
          echo "GLES global symbols: $GLES_SYMBOLS"

          if [ "$EGL_SYMBOLS" -lt 1 ]; then
            echo "ERROR: EGL contains no global symbols."
            exit 1
          fi

          if [ "$GLES_SYMBOLS" -lt 1 ]; then
            echo "ERROR: GLES contains no global symbols."
            exit 1
          fi

          echo ""
          echo "=================================================="
          echo "IMPORTANT"
          echo "=================================================="

          echo "A one-object ANGLE archive is valid."
          echo "Do NOT require 10+ archive members."
          echo "Do NOT require a minimum MB size."
          echo "Do NOT require llvm-ar."

      # ============================================================
      # 16. ACTUAL LINK TEST
      #
      # This is much more meaningful than checking whether the
      # archive happens to be large.
      #
      # We link a tiny ARM64 iOS executable against the two ANGLE
      # archives.
      # ============================================================

      - name: Link Test ANGLE Archives
        shell: bash
        run: |
          set -euo pipefail

          EGL="$OUT_DIR/obj/libEGL_static.a"
          GLES="$OUT_DIR/obj/libGLESv2_static.a"

          TEST_DIR="$RUNNER_TEMP/angle-link-test"

          rm -rf "$TEST_DIR"
          mkdir -p "$TEST_DIR"

          cat > "$TEST_DIR/main.mm" <<'EOF'
          #include <EGL/egl.h>
          #include <GLES2/gl2.h>

          int main() {
              EGLDisplay display = eglGetDisplay(EGL_DEFAULT_DISPLAY);

              if (display == EGL_NO_DISPLAY) {
                  return 0;
              }

              return 0;
          }
          EOF

          IOS_SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CLANGXX="$(xcrun --sdk iphoneos -f clang++)"

          echo "Compiling link test..."

          "$CLANGXX" \
            -target arm64-apple-ios \
            -isysroot "$IOS_SDK" \
            -miphoneos-version-min=12.0 \
            -I"$ANGLE_DIR/include" \
            -c \
            "$TEST_DIR/main.mm" \
            -o "$TEST_DIR/main.o"

          echo "Linking against ANGLE..."

          "$CLANGXX" \
            -target arm64-apple-ios \
            -isysroot "$IOS_SDK" \
            -miphoneos-version-min=12.0 \
            "$TEST_DIR/main.o" \
            "$EGL" \
            "$GLES" \
            -framework Metal \
            -framework Foundation \
            -framework QuartzCore \
            -framework IOSurface \
            -framework UIKit \
            -o "$TEST_DIR/angle-link-test"

          echo ""
          echo "Link succeeded."

          echo ""
          echo "Executable:"
          file "$TEST_DIR/angle-link-test"

          echo ""
          echo "Mach-O header:"
          xcrun --sdk iphoneos \
            otool -hv \
            "$TEST_DIR/angle-link-test"

      # ============================================================
      # 17. PREPARE ARTIFACTS
      # ============================================================

      - name: Prepare ANGLE Artifacts
        shell: bash
        run: |
          set -euo pipefail

          EGL="$OUT_DIR/obj/libEGL_static.a"
          GLES="$OUT_DIR/obj/libGLESv2_static.a"

          rm -rf "$ARTIFACT_DIR"

          mkdir -p \
            "$ARTIFACT_DIR/lib" \
            "$ARTIFACT_DIR/include"

          cp \
            "$EGL" \
            "$ARTIFACT_DIR/lib/libEGL_static.a"

          cp \
            "$GLES" \
            "$ARTIFACT_DIR/lib/libGLESv2_static.a"

          # Copy the ANGLE public headers.
          cp -R \
            "$ANGLE_DIR/include/" \
            "$ARTIFACT_DIR/include/"

          # Also provide revision information.
          git -C "$ANGLE_DIR" rev-parse HEAD \
            > "$ARTIFACT_DIR/ANGLE_COMMIT.txt"

          git -C "$ANGLE_DIR" log -1 --oneline \
            >> "$ARTIFACT_DIR/ANGLE_COMMIT.txt"

          echo ""
          echo "ANGLE artifacts:"
          find "$ARTIFACT_DIR" \
            -type f \
            -maxdepth 3 \
            -print \
            -exec ls -lh {} \;

      # ============================================================
      # 18. FINAL ARTIFACT VALIDATION
      # ============================================================

      - name: Final Artifact Validation
        shell: bash
        run: |
          set -euo pipefail

          EGL="$ARTIFACT_DIR/lib/libEGL_static.a"
          GLES="$ARTIFACT_DIR/lib/libGLESv2_static.a"

          test -f "$EGL"
          test -f "$GLES"

          echo "=================================================="
          echo "FINAL ANGLE iOS ARM64 STATIC LIBRARIES"
          echo "=================================================="

          echo ""
          echo "libEGL_static.a:"
          ls -lh "$EGL"
          file "$EGL"

          echo ""
          echo "libGLESv2_static.a:"
          ls -lh "$GLES"
          file "$GLES"

          echo ""
          echo "=================================================="
          echo "FINAL RESULT"
          echo "=================================================="

          echo "ANGLE iOS ARM64 Metal static libraries are ready."
          echo ""
          echo "Libraries:"
          echo "  lib/libEGL_static.a"
          echo "  lib/libGLESv2_static.a"
          echo ""
          echo "Headers:"
          echo "  include/"

      # ============================================================
      # 19. UPLOAD
      # ============================================================

      - name: Upload ANGLE iOS ARM64
        uses: actions/upload-artifact@v7
        with:
          name: angle-ios-arm64-metal-static
          path: angle-artifacts/
          if-no-files-found: error
          retention-days: 30
