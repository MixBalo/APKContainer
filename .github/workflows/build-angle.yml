name: Build ANGLE (iOS / ARM64)

on:
  workflow_dispatch:

jobs:
  build-angle:
    name: Build Static Libraries
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install depot_tools
        run: |
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git $HOME/depot_tools
          echo "$HOME/depot_tools" >> $GITHUB_PATH

      - name: Fetch ANGLE Source Code
        run: |
          mkdir -p angle-work
          cd angle-work
          fetch angle

      - name: Generate Build Files (gn)
        run: |
          cd angle-work/src
          gn gen out/ios --args='
            target_os="ios"
            target_cpu="arm64"
            target_environment="device"
            is_debug=false
            ios_enable_code_signing=false
            angle_enable_vulkan=false
            angle_enable_gl=false
            angle_enable_metal=true
            use_thin_archives=false
          '

      - name: Compile ANGLE (autoninja)
        run: |
          cd angle-work/src
          autoninja -C out/ios libEGL_static libGLESv2_static

      - name: Ensure Fat Archives
        run: |
          cd angle-work/src/out/ios/obj
          mkdir -p repacked
          
          # macOS /usr/bin/ar IS llvm-ar and handles thin archives correctly
          AR_CMD=$(which ar)
          
          for lib in libEGL_static libGLESv2_static; do
            echo "==> Processing $lib.a..."
            
            if file "$lib.a" | grep -q "thin archive"; then
              echo "  Thin archive detected. Repacking to regular archive..."
              
              rm -rf "extract_$lib"
              mkdir -p "extract_$lib"
              
              # Use ar x to properly extract objects from thin archive
              cd "extract_$lib"
              $AR_CMD x "../$lib.a"
              cd ..
              
              # Repack all extracted objects into a real (fat) archive
              find "extract_$lib" -type f -name "*.o" > "extract_$lib/objs.txt"
              $AR_CMD rcs "repacked/${lib%_static}.a" @"extract_$lib/objs.txt"
              
              rm -rf "extract_$lib"
            else
              echo "  Regular archive detected. Copying as-is..."
              cp "$lib.a" "repacked/${lib%_static}.a"
            fi
            
            # Hard fail if we somehow still produced a thin archive
            if file "repacked/${lib%_static}.a" | grep -q "thin archive"; then
              echo "ERROR: repacked/${lib%_static}.a is still a thin archive!"
              exit 1
            fi
            
            echo "  Result:"
            ls -lh "repacked/${lib%_static}.a"
            file "repacked/${lib%_static}.a"
          done

      - name: Upload Fat Archives
        uses: actions/upload-artifact@v4
        with:
          name: angle-ios-static-libs
          path: angle-work/src/out/ios/obj/repacked/*.a
          retention-days: 7
