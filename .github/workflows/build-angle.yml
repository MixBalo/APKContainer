name: Build ANGLE (iOS / ARM64)

on:
  workflow_dispatch:

jobs:
  build-angle:
    name: Build Static Libraries
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install depot_tools
        run: |
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git $HOME/depot_tools
          echo "$HOME/depot_tools" >> $GITHUB_PATH

      - name: Fetch ANGLE Source Code
        run: |
          mkdir -p angle-work
          cd angle-work
          fetch angle

      - name: Generate Build Files (gn)
        run: |
          cd angle-work/src
          gn gen out/ios --args='
            target_os="ios"
            target_cpu="arm64"
            target_environment="device"
            is_debug=false
            ios_enable_code_signing=false
            angle_enable_vulkan=false
            angle_enable_gl=false
            angle_enable_metal=true
            use_thin_archives=false
          '

      - name: Compile ANGLE (autoninja)
        run: |
          cd angle-work/src
          autoninja -C out/ios libEGL_static libGLESv2_static

      - name: Convert Thin Archives to Fat Archives
        run: |
          cd angle-work/src/out/ios/obj
          mkdir -p repacked
          
          # Helper function to extract and repack archives
          repack_archive() {
            local lib_name=$1
            local archive_path="$lib_name.a"
            local output_path="repacked/${lib_name%_static}.a"
            
            echo "==> Processing $lib_name.a..."
            
            if [ ! -f "$archive_path" ]; then
              echo "ERROR: $archive_path not found!"
              exit 1
            fi
            
            # Check if it's a thin archive
            if file "$archive_path" | grep -q "thin archive"; then
              echo "  Thin archive detected. Examining contents..."
              
              # Dump the thin archive header to see what it references
              echo "  Thin archive format - attempting to read referenced files..."
              
              # Create temp directory for extraction
              local extract_dir="extract_$lib_name"
              rm -rf "$extract_dir"
              mkdir -p "$extract_dir"
              
              # Try to use ranlib to rebuild as fat archive
              # ranlib with no args may help consolidate
              echo "  Attempting ranlib consolidation..."
              ranlib "$archive_path" 2>/dev/null || true
              
              # Now try libtool with verbose output
              echo "  Using libtool to convert thin archive to fat..."
              libtool -static -o "$output_path.tmp" "$archive_path" 2>&1 || {
                echo "  libtool failed, trying alternative method..."
                
                # Alternative: use otool to inspect, then manually rebuild
                # First, let's try to use ar with member extraction using a different approach
                # Create a new archive from scratch by using ar to read and write
                
                cd "$extract_dir"
                
                # Use ar -t to list members, then ar -p to extract each one
                ar -t "../$archive_path" > members.txt 2>/dev/null || {
                  echo "  WARNING: ar -t failed. Thin archive may be corrupted."
                  # Last resort: check if objects are in parent directories
                  cd ..
                  
                  # Look for .o files in common build locations
                  echo "  Searching for object files in build tree..."
                  find .. -name "*.o" -type f 2>/dev/null > "$extract_dir/found_objs.txt"
                  
                  local found_count=$(wc -l < "$extract_dir/found_objs.txt")
                  if [ "$found_count" -gt 0 ]; then
                    echo "  Found $found_count object files in build tree"
                    # Try to pack these
                    ar -rcs "$output_path" $(head -50 "$extract_dir/found_objs.txt" | tr '\n' ' ')
                    
                    if file "$output_path" | grep -q "thin archive"; then
                      echo "  ERROR: Still thin archive after repacking"
                      exit 1
                    fi
                    
                    rm -rf "$extract_dir"
                    echo "  ✓ Successfully created fat archive"
                    ls -lh "$output_path"
                    file "$output_path"
                    return 0
                  else
                    echo "  ERROR: Could not find any object files"
                    exit 1
                  fi
                }
                
                # Extract all members
                cat members.txt | while read member; do
                  if [ -n "$member" ]; then
                    ar -p "../$archive_path" "$member" > "$member" 2>/dev/null
                  fi
                done
                
                cd ..
                
                # Check if extraction worked
                local obj_count=$(find "$extract_dir" -name "*.o" -type f | wc -l)
                if [ "$obj_count" -eq 0 ]; then
                  echo "  ERROR: Failed to extract any object files from thin archive"
                  exit 1
                fi
                
                echo "  Extracted $obj_count object files"
                ar -rcs "$output_path" "$extract_dir"/*.o
              }
              
              # If libtool worked, use the temp file
              if [ -f "$output_path.tmp" ]; then
                mv "$output_path.tmp" "$output_path"
              fi
              
              # Verify final result
              if ! file "$output_path" | grep -q "thin archive"; then
                local size=$(du -h "$output_path" | cut -f1)
                echo "  ✓ Successfully created fat archive ($size)"
              else
                echo "  ERROR: Final archive is still thin!"
                exit 1
              fi
              
              rm -rf "$extract_dir"
            else
              echo "  Regular (fat) archive detected. Copying as-is..."
              cp "$archive_path" "$output_path"
              local size=$(du -h "$output_path" | cut -f1)
              echo "  ✓ Copied fat archive ($size)"
            fi
            
            echo "  Final details:"
            ls -lh "$output_path"
            file "$output_path"
          }
          
          repack_archive "libEGL_static"
          repack_archive "libGLESv2_static"

      - name: Upload Fat Archives
        uses: actions/upload-artifact@v4
        with:
          name: angle-ios-static-libs
          path: angle-work/src/out/ios/obj/repacked/*.a
          retention-days: 7
