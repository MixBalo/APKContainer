name: Build ANGLE (iOS / ARM64)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-angle:
    name: Build Static Libraries
    runs-on: macos-latest

    steps:
      # ==============================================================
      # Checkout
      # ==============================================================

      - name: Checkout Repository
        uses: actions/checkout@v6

      # ==============================================================
      # Cache week
      # ==============================================================

      - name: Get Cache Week
        id: week
        shell: bash
        run: |
          set -euo pipefail

          echo "week=$(date +%Y-%U)" >> "$GITHUB_OUTPUT"

      # ==============================================================
      # depot_tools
      # ==============================================================

      - name: Cache depot_tools
        uses: actions/cache@v5
        with:
          path: ~/depot_tools
          key: depot-tools-${{ runner.os }}-${{ steps.week.outputs.week }}
          restore-keys: |
            depot-tools-${{ runner.os }}-

      - name: Install depot_tools
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "$HOME/depot_tools" ]; then
            echo "Installing depot_tools..."

            git clone --depth=1 \
              https://chromium.googlesource.com/chromium/tools/depot_tools.git \
              "$HOME/depot_tools"
          else
            echo "depot_tools restored from cache."
          fi

          echo "$HOME/depot_tools" >> "$GITHUB_PATH"

      # ==============================================================
      # ANGLE source cache
      # ==============================================================

      - name: Cache ANGLE Source
        id: cache-angle
        uses: actions/cache@v5
        with:
          path: angle-work
          key: angle-source-v7-${{ runner.os }}-${{ steps.week.outputs.week }}-${{ hashFiles('.github/workflows/build-angle.yml') }}
          restore-keys: |
            angle-source-v7-${{ runner.os }}-

      # ==============================================================
      # Fetch ANGLE
      # ==============================================================

      - name: Fetch ANGLE Source Code
        if: steps.cache-angle.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "ANGLE cache miss."
          echo "Fetching ANGLE source..."

          rm -rf angle-work
          mkdir -p angle-work

          cd angle-work

          fetch angle

      # ==============================================================
      # Synchronize ANGLE dependencies
      # ==============================================================

      - name: Synchronize ANGLE
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/angle-work"

          if [ ! -f ".gclient" ]; then
            echo "ERROR: .gclient not found."
            exit 1
          fi

          echo "Synchronizing ANGLE dependencies..."

          gclient sync \
            --no-history \
            --jobs=4

      # ==============================================================
      # Locate ANGLE
      # ==============================================================

      - name: Locate ANGLE Source Directory
        id: angle-source
        shell: bash
        run: |
          set -euo pipefail

          ANGLE_SRC="$GITHUB_WORKSPACE/angle-work"

          echo "ANGLE source:"
          echo "$ANGLE_SRC"

          if [ ! -f "$ANGLE_SRC/.gclient" ]; then
            echo "ERROR: Missing:"
            echo "$ANGLE_SRC/.gclient"
            exit 1
          fi

          if [ ! -f "$ANGLE_SRC/BUILD.gn" ]; then
            echo "ERROR: Missing:"
            echo "$ANGLE_SRC/BUILD.gn"
            exit 1
          fi

          if [ ! -f "$ANGLE_SRC/gni/angle.gni" ]; then
            echo "ERROR: Missing:"
            echo "$ANGLE_SRC/gni/angle.gni"
            exit 1
          fi

          if ! grep -q 'libEGL_static' "$ANGLE_SRC/BUILD.gn"; then
            echo "ERROR: libEGL_static not found."
            exit 1
          fi

          if ! grep -q 'libGLESv2_static' "$ANGLE_SRC/BUILD.gn"; then
            echo "ERROR: libGLESv2_static not found."
            exit 1
          fi

          echo "ANGLE_SRC=$ANGLE_SRC" >> "$GITHUB_ENV"
          echo "angle_src=$ANGLE_SRC" >> "$GITHUB_OUTPUT"

      # ==============================================================
      # Verify ANGLE source
      # ==============================================================

      - name: Verify ANGLE Source
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANGLE_SRC"

          echo "=================================================="
          echo "ANGLE SOURCE"
          echo "=================================================="

          echo "Source:"
          echo "$ANGLE_SRC"

          echo ""
          echo "ANGLE revision:"
          git rev-parse HEAD

          echo ""
          echo "ANGLE commit:"
          git log -1 --oneline

          echo ""
          echo "BUILD.gn:"
          ls -lh BUILD.gn

          echo ""
          echo "gni/angle.gni:"
          ls -lh gni/angle.gni

          echo ""
          echo "Static targets:"
          grep -n -E \
            'angle_static_library\("lib(EGL|GLESv2)_static"\)|lib(EGL|GLESv2)_static' \
            BUILD.gn \
            | head -50 || true

      # ==============================================================
      # Patch ANGLE static-library template
      #
      # IMPORTANT:
      #
      # ANGLE's template does:
      #
      #   static_library(target_name) {
      #     forward_variables_from(...)
      #     configs += invoker.configs
      #     configs -= invoker.suppressed_configs
      #   }
      #
      # Therefore thin_archive MUST be removed AFTER configs are added.
      #
      # Chromium requires both:
      #
      #   complete_static_lib = true
      #   configs -= [ "//build/config/compiler:thin_archive" ]
      #
      # for a distributable static archive.
      #
      # This patch is idempotent.
      # ==============================================================

      - name: Configure Complete Static Libraries
        shell: bash
        run: |
          set -euo pipefail

          GNI="$ANGLE_SRC/gni/angle.gni"

          echo "=================================================="
          echo "PATCHING ANGLE STATIC LIBRARY TEMPLATE"
          echo "=================================================="

          python3 - "$GNI" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          template_start = text.find('template("angle_static_library")')

          if template_start == -1:
              raise SystemExit(
                  "ERROR: angle_static_library template was not found."
              )

          # Find the next template declaration after angle_static_library.
          next_template = text.find(
              '\ntemplate("',
              template_start + 1,
          )

          if next_template == -1:
              next_template = len(text)

          block = text[template_start:next_template]

          static_marker = 'static_library(target_name) {'

          static_start = block.find(static_marker)

          if static_start == -1:
              raise SystemExit(
                  "ERROR: static_library(target_name) was not found "
                  "inside angle_static_library."
              )

          # Find the end of the static_library block by looking for the
          # closing sequence that precedes the end of this template.
          #
          # We don't need a full GN parser: the current ANGLE template has
          # a single static_library(target_name) block.
          static_block_start = static_start + len(static_marker)

          # Work on the body after static_library(target_name) {
          body = block[static_block_start:]

          complete_line = '  complete_static_lib = true\n'
          thin_line = (
              '  configs -= [ "//build/config/compiler:thin_archive" ]\n'
          )

          # ------------------------------------------------------------
          # complete_static_lib
          # ------------------------------------------------------------

          if 'complete_static_lib = true' not in body:
              # Put this immediately inside static_library().
              insert_at = static_block_start

              block = (
                  block[:insert_at]
                  + '\n'
                  + complete_line
                  + block[insert_at:]
              )

          # Recalculate after possible insertion.
          static_start = block.find(static_marker)

          if static_start == -1:
              raise SystemExit(
                  "ERROR: static_library(target_name) disappeared "
                  "during patching."
              )

          static_body_start = static_start + len(static_marker)

          # ------------------------------------------------------------
          # thin_archive removal
          #
          # Put it AFTER configs += invoker.configs and
          # configs -= invoker.suppressed_configs.
          # ------------------------------------------------------------

          configs_add = 'configs += invoker.configs'
          configs_remove = 'configs -= invoker.suppressed_configs'

          add_pos = block.find(
              configs_add,
              static_body_start,
          )

          remove_pos = block.find(
              configs_remove,
              static_body_start,
          )

          if add_pos == -1:
              raise SystemExit(
                  "ERROR: configs += invoker.configs was not found."
              )

          if remove_pos == -1:
              raise SystemExit(
                  "ERROR: configs -= invoker.suppressed_configs "
                  "was not found."
              )

          if remove_pos < add_pos:
              raise SystemExit(
                  "ERROR: Unexpected ANGLE template ordering: "
                  "suppressed configs appear before invoker configs."
              )

          if (
              'configs -= [ "//build/config/compiler:thin_archive" ]'
              not in block
          ):
              line_end = block.find('\n', remove_pos)

              if line_end == -1:
                  raise SystemExit(
                      "ERROR: Could not determine configs line boundary."
                  )

              insertion_point = line_end + 1

              block = (
                  block[:insertion_point]
                  + thin_line
                  + block[insertion_point:]
              )

          # Replace the original template block.
          new_text = (
              text[:template_start]
              + block
              + text[next_template:]
          )

          path.write_text(new_text)

          print("Patch completed successfully.")
          PY

          echo ""
          echo "=================================================="
          echo "PATCHED TEMPLATE"
          echo "=================================================="

          sed -n \
            '/template("angle_static_library")/,/^}/p' \
            "$GNI" \
            | head -100

      # ==============================================================
      # Verify patch
      # ==============================================================

      - name: Verify Static Library Patch
        shell: bash
        run: |
          set -euo pipefail

          GNI="$ANGLE_SRC/gni/angle.gni"

          echo "=================================================="
          echo "VERIFY STATIC LIBRARY PATCH"
          echo "=================================================="

          if ! grep -q \
            'complete_static_lib = true' \
            "$GNI"; then
            echo "ERROR: complete_static_lib=true is missing."
            exit 1
          fi

          if ! grep -q \
            'configs -= \[ "//build/config/compiler:thin_archive" \]' \
            "$GNI"; then
            echo "ERROR: thin_archive removal is missing."
            exit 1
          fi

          COMPLETE_LINE=$(
            grep -n \
              'complete_static_lib = true' \
              "$GNI" \
              | head -1 \
              | cut -d: -f1
          )

          THIN_LINE=$(
            grep -n \
              'configs -= \[ "//build/config/compiler:thin_archive" \]' \
              "$GNI" \
              | head -1 \
              | cut -d: -f1
          )

          CONFIG_ADD_LINE=$(
            grep -n \
              'configs += invoker.configs' \
              "$GNI" \
              | head -1 \
              | cut -d: -f1
          )

          CONFIG_REMOVE_LINE=$(
            grep -n \
              'configs -= invoker.suppressed_configs' \
              "$GNI" \
              | head -1 \
              | cut -d: -f1
          )

          echo "complete_static_lib line: $COMPLETE_LINE"
          echo "configs += invoker.configs line: $CONFIG_ADD_LINE"
          echo "configs -= invoker.suppressed_configs line: $CONFIG_REMOVE_LINE"
          echo "thin_archive removal line: $THIN_LINE"

          if [ "$THIN_LINE" -le "$CONFIG_REMOVE_LINE" ]; then
            echo "ERROR: thin_archive removal occurs before suppressed-config removal."
            echo "The removal must happen AFTER ANGLE adds its configs."
            exit 1
          fi

          echo ""
          echo "Static library patch verified."

      # ==============================================================
      # Generate GN files
      # ==============================================================

      - name: Generate Build Files
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANGLE_SRC"

          rm -rf out/ios

          gn gen out/ios --args='
            target_os="ios"
            target_cpu="arm64"
            target_environment="device"

            is_debug=false
            is_component_build=false
            is_official_build=false

            ios_enable_code_signing=false

            angle_enable_metal=true
            angle_enable_vulkan=false
            angle_enable_gl=false
          '

      # ==============================================================
      # Verify GN configuration
      # ==============================================================

      - name: Verify GN Configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANGLE_SRC"

          echo "=================================================="
          echo "GN CONFIGURATION"
          echo "=================================================="

          gn args out/ios --list \
            | grep -E \
              '^(target_os|target_cpu|target_environment|is_debug|is_component_build|is_official_build|ios_enable_code_signing|angle_enable_metal|angle_enable_vulkan|angle_enable_gl)' \
            || true

          echo ""
          echo "=================================================="
          echo "GN CHECK"
          echo "=================================================="

          gn check out/ios //:libGLESv2_static
          gn check out/ios //:libEGL_static

          echo ""
          echo "GN check passed."

      # ==============================================================
      # Inspect targets
      #
      # DO NOT use:
      #
      #   gn desc out/ios //:libGLESv2_static complete_static_lib
      #
      # complete_static_lib is not a valid gn desc item.
      # ==============================================================

      - name: Inspect GN Static Targets
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANGLE_SRC"

          echo "=================================================="
          echo "libGLESv2_static"
          echo "=================================================="

          gn desc out/ios //:libGLESv2_static

          echo ""
          echo "=================================================="
          echo "libEGL_static"
          echo "=================================================="

          gn desc out/ios //:libEGL_static

          echo ""
          echo "=================================================="
          echo "GENERATED TARGET FILES"
          echo "=================================================="

          ninja -C out/ios -t targets all \
            | grep -E \
              'lib(EGL|GLESv2)_static\.a' \
            | head -50 \
            || true

      # ==============================================================
      # Build GLES first
      # ==============================================================

      - name: Build libGLESv2_static
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANGLE_SRC"

          echo "=================================================="
          echo "BUILD libGLESv2_static"
          echo "=================================================="

          autoninja \
            -C out/ios \
            -j2 \
            libGLESv2_static

      # ==============================================================
      # Build EGL
      # ==============================================================

      - name: Build libEGL_static
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANGLE_SRC"

          echo "=================================================="
          echo "BUILD libEGL_static"
          echo "=================================================="

          autoninja \
            -C out/ios \
            -j2 \
            libEGL_static

      # ==============================================================
      # Locate archives
      # ==============================================================

      - name: Locate Generated Libraries
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "GENERATED ARCHIVES"
          echo "=================================================="

          find "$ANGLE_SRC/out/ios" \
            -type f \
            \( \
              -name "*.a" \
              -o \
              -name "*.thin.a" \
            \) \
            -print \
            | sort

      # ==============================================================
      # Verify exact archive paths
      # ==============================================================

      - name: Verify Archive Paths
        shell: bash
        run: |
          set -euo pipefail

          EGL="$ANGLE_SRC/out/ios/obj/libEGL_static.a"
          GLES="$ANGLE_SRC/out/ios/obj/libGLESv2_static.a"

          echo "=================================================="
          echo "VERIFY ARCHIVE PATHS"
          echo "=================================================="

          if [ ! -f "$EGL" ]; then
            echo "ERROR: libEGL_static.a was not generated."
            echo "Expected:"
            echo "$EGL"
            exit 1
          fi

          if [ ! -f "$GLES" ]; then
            echo "ERROR: libGLESv2_static.a was not generated."
            echo "Expected:"
            echo "$GLES"
            exit 1
          fi

          echo "EGL:"
          echo "$EGL"

          echo ""
          echo "GLES:"
          echo "$GLES"

      # ==============================================================
      # Validate final archives
      #
      # DO NOT use an arbitrary 1 MB minimum.
      #
      # A valid ANGLE archive may legitimately be smaller than 1 MB.
      # The important properties are:
      #
      #   1. It is NOT a thin archive.
      #   2. It contains real object members.
      #   3. The members are Mach-O ARM64 objects.
      #   4. The archive contains symbols.
      #
      # ==============================================================

      - name: Verify Static Libraries
        shell: bash
        run: |
          set -euo pipefail

          EGL="$ANGLE_SRC/out/ios/obj/libEGL_static.a"
          GLES="$ANGLE_SRC/out/ios/obj/libGLESv2_static.a"

          echo "=================================================="
          echo "FILE TYPES"
          echo "=================================================="

          EGL_FILE="$(file "$EGL")"
          GLES_FILE="$(file "$GLES")"

          echo "$EGL_FILE"
          echo "$GLES_FILE"

          echo ""
          echo "=================================================="
          echo "REJECT THIN ARCHIVES"
          echo "=================================================="

          if echo "$EGL_FILE" | grep -qi 'thin archive'; then
            echo "ERROR: libEGL_static.a is a thin archive."
            exit 1
          fi

          if echo "$GLES_FILE" | grep -qi 'thin archive'; then
            echo "ERROR: libGLESv2_static.a is a thin archive."
            exit 1
          fi

          echo "Both archives are normal, non-thin archives."

          echo ""
          echo "=================================================="
          echo "ARCHIVE SIZES"
          echo "=================================================="

          EGL_SIZE=$(stat -f%z "$EGL")
          GLES_SIZE=$(stat -f%z "$GLES")

          ls -lh "$EGL"
          ls -lh "$GLES"

          echo ""
          echo "libEGL_static.a: ${EGL_SIZE} bytes"
          echo "libGLESv2_static.a: ${GLES_SIZE} bytes"

          # Only reject an actually empty/tiny archive.
          # Do NOT impose an arbitrary 1 MB requirement.
          if [ "$EGL_SIZE" -lt 4096 ]; then
            echo "ERROR: libEGL_static.a is unexpectedly tiny."
            exit 1
          fi

          if [ "$GLES_SIZE" -lt 4096 ]; then
            echo "ERROR: libGLESv2_static.a is unexpectedly tiny."
            exit 1
          fi

          echo "Archive sizes are plausible."

          echo ""
          echo "=================================================="
          echo "ARCHIVE MEMBER COUNTS"
          echo "=================================================="

          EGL_COUNT=$(
            /usr/bin/ar -t "$EGL" |
            wc -l |
            tr -d ' '
          )

          GLES_COUNT=$(
            /usr/bin/ar -t "$GLES" |
            wc -l |
            tr -d ' '
          )

          echo "libEGL_static.a members: $EGL_COUNT"
          echo "libGLESv2_static.a members: $GLES_COUNT"

          if [ "$EGL_COUNT" -lt 1 ]; then
            echo "ERROR: libEGL_static.a contains no members."
            exit 1
          fi

          if [ "$GLES_COUNT" -lt 1 ]; then
            echo "ERROR: libGLESv2_static.a contains no members."
            exit 1
          fi

          echo ""
          echo "First EGL members:"
          /usr/bin/ar -t "$EGL" | head -30

          echo ""
          echo "First GLES members:"
          /usr/bin/ar -t "$GLES" | head -30

          echo ""
          echo "=================================================="
          echo "EXTRACT OBJECT FILES"
          echo "=================================================="

          TMP_EGL="$(mktemp -d)"
          TMP_GLES="$(mktemp -d)"

          cleanup() {
            rm -rf "$TMP_EGL" "$TMP_GLES"
          }

          trap cleanup EXIT

          (
            cd "$TMP_EGL"
            /usr/bin/ar -x "$EGL"
          )

          (
            cd "$TMP_GLES"
            /usr/bin/ar -x "$GLES"
          )

          EGL_OBJECTS=$(
            find "$TMP_EGL" \
              -type f \
              -name "*.o" |
            wc -l |
            tr -d ' '
          )

          GLES_OBJECTS=$(
            find "$TMP_GLES" \
              -type f \
              -name "*.o" |
            wc -l |
            tr -d ' '
          )

          echo "EGL object files: $EGL_OBJECTS"
          echo "GLES object files: $GLES_OBJECTS"

          if [ "$EGL_OBJECTS" -lt 1 ]; then
            echo "ERROR: libEGL_static.a contains no object files."
            exit 1
          fi

          if [ "$GLES_OBJECTS" -lt 1 ]; then
            echo "ERROR: libGLESv2_static.a contains no object files."
            exit 1
          fi

          echo ""
          echo "=================================================="
          echo "VERIFY ARM64 MACH-O OBJECTS"
          echo "=================================================="

          EGL_ARM64=0
          GLES_ARM64=0

          while IFS= read -r -d '' obj; do
            DESCRIPTION="$(file "$obj")"

            if echo "$DESCRIPTION" | grep -Eqi \
              'Mach-O.*arm64|Mach-O 64-bit.*arm64'; then
              EGL_ARM64=$((EGL_ARM64 + 1))
            else
              echo "WARNING: non-ARM64 EGL object:"
              echo "$DESCRIPTION"
            fi
          done < <(
            find "$TMP_EGL" \
              -type f \
              -name "*.o" \
              -print0
          )

          while IFS= read -r -d '' obj; do
            DESCRIPTION="$(file "$obj")"

            if echo "$DESCRIPTION" | grep -Eqi \
              'Mach-O.*arm64|Mach-O 64-bit.*arm64'; then
              GLES_ARM64=$((GLES_ARM64 + 1))
            else
              echo "WARNING: non-ARM64 GLES object:"
              echo "$DESCRIPTION"
            fi
          done < <(
            find "$TMP_GLES" \
              -type f \
              -name "*.o" \
              -print0
          )

          echo ""
          echo "ARM64 EGL objects: $EGL_ARM64"
          echo "ARM64 GLES objects: $GLES_ARM64"

          if [ "$EGL_ARM64" -eq 0 ]; then
            echo "ERROR: No ARM64 EGL objects found."
            exit 1
          fi

          if [ "$GLES_ARM64" -eq 0 ]; then
            echo "ERROR: No ARM64 GLES objects found."
            exit 1
          fi

          echo ""
          echo "=================================================="
          echo "SYMBOL VALIDATION"
          echo "=================================================="

          EGL_SYMBOLS=$(
            nm -gU "$EGL" 2>/dev/null |
            wc -l |
            tr -d ' '
          )

          GLES_SYMBOLS=$(
            nm -gU "$GLES" 2>/dev/null |
            wc -l |
            tr -d ' '
          )

          echo "EGL global symbols: $EGL_SYMBOLS"
          echo "GLES global symbols: $GLES_SYMBOLS"

          if [ "$EGL_SYMBOLS" -lt 1 ]; then
            echo "ERROR: libEGL_static.a contains no global symbols."
            exit 1
          fi

          if [ "$GLES_SYMBOLS" -lt 1 ]; then
            echo "ERROR: libGLESv2_static.a contains no global symbols."
            exit 1
          fi

          echo ""
          echo "=================================================="
          echo "LLVM AR TEST"
          echo "=================================================="

          llvm-ar -t "$EGL" | head -20
          llvm-ar -t "$GLES" | head -20

          echo ""
          echo "=================================================="
          echo "STATIC LIBRARIES PASSED VALIDATION"
          echo "=================================================="

      - name: Inspect Generated Archives
        shell: bash
        run: |
          set -euo pipefail

          EGL="$ANGLE_SRC/out/ios/obj/libEGL_static.a"
          GLES="$ANGLE_SRC/out/ios/obj/libGLESv2_static.a"

          echo "=================================================="
          echo "EGL ARCHIVE"
          echo "=================================================="

          file "$EGL"

          echo ""
          echo "Members:"
          /usr/bin/ar -t "$EGL"

          echo ""
          echo "Object sizes:"
          /usr/bin/ar -tv "$EGL"

          echo ""
          echo "=================================================="
          echo "GLES ARCHIVE"
          echo "=================================================="

          file "$GLES"

          echo ""
          echo "Members:"
          /usr/bin/ar -t "$GLES" | head -100

          echo ""
          echo "Object sizes:"
          /usr/bin/ar -tv "$GLES" | head -100
      
      # ==============================================================
      # Archive member verification
      # ==============================================================

      - name: Verify Archive Members
        shell: bash
        run: |
          set -euo pipefail

          EGL="$ANGLE_SRC/out/ios/obj/libEGL_static.a"
          GLES="$ANGLE_SRC/out/ios/obj/libGLESv2_static.a"

          echo "=================================================="
          echo "ARCHIVE MEMBER COUNTS"
          echo "=================================================="

          EGL_COUNT=$(
            /usr/bin/ar -t "$EGL" |
            wc -l |
            tr -d ' '
          )

          GLES_COUNT=$(
            /usr/bin/ar -t "$GLES" |
            wc -l |
            tr -d ' '
          )

          echo "libEGL_static.a members: $EGL_COUNT"
          echo "libGLESv2_static.a members: $GLES_COUNT"

          if [ "$EGL_COUNT" -lt 10 ]; then
            echo "ERROR: libEGL_static.a contains too few members."
            exit 1
          fi

          if [ "$GLES_COUNT" -lt 10 ]; then
            echo "ERROR: libGLESv2_static.a contains too few members."
            exit 1
          fi

          echo ""
          echo "First EGL members:"
          /usr/bin/ar -t "$EGL" | head -20

          echo ""
          echo "First GLES members:"
          /usr/bin/ar -t "$GLES" | head -20

      # ==============================================================
      # Extract archives and verify actual object files
      # ==============================================================

      - name: Verify ARM64 Objects
        shell: bash
        run: |
          set -euo pipefail

          EGL="$ANGLE_SRC/out/ios/obj/libEGL_static.a"
          GLES="$ANGLE_SRC/out/ios/obj/libGLESv2_static.a"

          TMP_EGL="$(mktemp -d)"
          TMP_GLES="$(mktemp -d)"

          cleanup() {
            rm -rf "$TMP_EGL" "$TMP_GLES"
          }

          trap cleanup EXIT

          echo "=================================================="
          echo "EXTRACT EGL"
          echo "=================================================="

          (
            cd "$TMP_EGL"
            /usr/bin/ar -x "$EGL"
          )

          echo "=================================================="
          echo "EXTRACT GLES"
          echo "=================================================="

          (
            cd "$TMP_GLES"
            /usr/bin/ar -x "$GLES"
          )

          EGL_OBJECTS=$(
            find "$TMP_EGL" \
              -type f \
              -name "*.o" |
            wc -l |
            tr -d ' '
          )

          GLES_OBJECTS=$(
            find "$TMP_GLES" \
              -type f \
              -name "*.o" |
            wc -l |
            tr -d ' '
          )

          echo ""
          echo "EGL object files: $EGL_OBJECTS"
          echo "GLES object files: $GLES_OBJECTS"

          if [ "$EGL_OBJECTS" -lt 10 ]; then
            echo "ERROR: Too few EGL object files."
            exit 1
          fi

          if [ "$GLES_OBJECTS" -lt 10 ]; then
            echo "ERROR: Too few GLES object files."
            exit 1
          fi

          echo ""
          echo "=================================================="
          echo "VERIFY ARM64 MACH-O OBJECTS"
          echo "=================================================="

          EGL_ARM64=0
          GLES_ARM64=0

          while IFS= read -r -d '' obj; do
            if file "$obj" | grep -Eqi \
              'Mach-O.*arm64|Mach-O 64-bit.*arm64'; then
              EGL_ARM64=$((EGL_ARM64 + 1))
            fi
          done < <(
            find "$TMP_EGL" \
              -type f \
              -name "*.o" \
              -print0
          )

          while IFS= read -r -d '' obj; do
            if file "$obj" | grep -Eqi \
              'Mach-O.*arm64|Mach-O 64-bit.*arm64'; then
              GLES_ARM64=$((GLES_ARM64 + 1))
            fi
          done < <(
            find "$TMP_GLES" \
              -type f \
              -name "*.o" \
              -print0
          )

          echo "ARM64 EGL objects: $EGL_ARM64"
          echo "ARM64 GLES objects: $GLES_ARM64"

          if [ "$EGL_ARM64" -eq 0 ]; then
            echo "ERROR: No ARM64 EGL objects found."
            exit 1
          fi

          if [ "$GLES_ARM64" -eq 0 ]; then
            echo "ERROR: No ARM64 GLES objects found."
            exit 1
          fi

      # ==============================================================
      # Verify symbols
      # ==============================================================

      - name: Verify ANGLE Symbols
        shell: bash
        run: |
          set -euo pipefail

          EGL="$ANGLE_SRC/out/ios/obj/libEGL_static.a"
          GLES="$ANGLE_SRC/out/ios/obj/libGLESv2_static.a"

          echo "=================================================="
          echo "SYMBOL COUNTS"
          echo "=================================================="

          EGL_SYMBOLS=$(
            nm -gU "$EGL" 2>/dev/null |
            wc -l |
            tr -d ' '
          )

          GLES_SYMBOLS=$(
            nm -gU "$GLES" 2>/dev/null |
            wc -l |
            tr -d ' '
          )

          echo "EGL global symbols: $EGL_SYMBOLS"
          echo "GLES global symbols: $GLES_SYMBOLS"

          if [ "$EGL_SYMBOLS" -lt 10 ]; then
            echo "ERROR: libEGL_static.a has too few global symbols."
            exit 1
          fi

          if [ "$GLES_SYMBOLS" -lt 10 ]; then
            echo "ERROR: libGLESv2_static.a has too few global symbols."
            exit 1
          fi

          echo ""
          echo "First EGL symbols:"
          nm -gU "$EGL" 2>/dev/null | head -30 || true

          echo ""
          echo "First GLES symbols:"
          nm -gU "$GLES" 2>/dev/null | head -30 || true

      # ==============================================================
      # Final summary
      # ==============================================================

      - name: Final Library Summary
        shell: bash
        run: |
          set -euo pipefail

          EGL="$ANGLE_SRC/out/ios/obj/libEGL_static.a"
          GLES="$ANGLE_SRC/out/ios/obj/libGLESv2_static.a"

          echo ""
          echo "=================================================="
          echo "FINAL ANGLE iOS ARM64 STATIC LIBRARIES"
          echo "=================================================="

          echo ""
          echo "libEGL_static.a"
          file "$EGL"
          ls -lh "$EGL"
          echo "Members: $(/usr/bin/ar -t "$EGL" | wc -l | tr -d ' ')"

          echo ""
          echo "libGLESv2_static.a"
          file "$GLES"
          ls -lh "$GLES"
          echo "Members: $(/usr/bin/ar -t "$GLES" | wc -l | tr -d ' ')"

          echo ""
          echo "=================================================="
          echo "STATIC LIBRARIES PASSED VALIDATION"
          echo "=================================================="

      # ==============================================================
      # Prepare artifacts
      # ==============================================================

      - name: Prepare Artifacts
        shell: bash
        run: |
          set -euo pipefail

          ARTIFACT_DIR="$GITHUB_WORKSPACE/angle-artifacts"

          rm -rf "$ARTIFACT_DIR"
          mkdir -p "$ARTIFACT_DIR"

          cp \
            "$ANGLE_SRC/out/ios/obj/libEGL_static.a" \
            "$ARTIFACT_DIR/libEGL_static.a"

          cp \
            "$ANGLE_SRC/out/ios/obj/libGLESv2_static.a" \
            "$ARTIFACT_DIR/libGLESv2_static.a"

          echo "=================================================="
          echo "ARTIFACTS"
          echo "=================================================="

          ls -lh "$ARTIFACT_DIR"

      # ==============================================================
      # Upload
      # ==============================================================

      - name: Upload Static Archives
        uses: actions/upload-artifact@v7
        with:
          name: angle-ios-arm64-static-libs
          path: angle-artifacts/
          if-no-files-found: error
          retention-days: 7
