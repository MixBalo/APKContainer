name: Build ANGLE (iOS / ARM64)

on:
  workflow_dispatch: # This allows you to manually trigger the build via a button

jobs:
  build-angle:
    name: Build Static Libraries
    runs-on: macos-latest # Uses a modern macOS runner, avoiding all Catalina issues

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install depot_tools
        run: |
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git $HOME/depot_tools
          echo "$HOME/depot_tools" >> $GITHUB_PATH

      - name: Fetch ANGLE Source Code
        run: |
          mkdir -p angle-work
          cd angle-work
          # fetch is part of depot_tools
          fetch angle

      - name: Generate Build Files (gn)
        run: |
          cd angle-work/src
          gn gen out/ios --args='
            target_os="ios"
            target_cpu="arm64"
            target_environment="device"
            is_debug=false
            ios_enable_code_signing=false
            angle_enable_vulkan=false
            angle_enable_gl=false
            angle_enable_metal=true
            use_thin_archives=false
          '

      - name: Compile ANGLE (autoninja)
        run: |
          cd angle-work/src
          autoninja -C out/ios libEGL_static libGLESv2_static

      - name: Force Repack to Fat Archives
        run: |
          cd angle-work/src/out/ios/obj
          mkdir -p repacked
          
          # Use macOS's built-in llvm-ar
          LLVM_AR=$(xcode-select -p)/usr/bin/llvm-ar
          
          echo "==> Repacking libEGL..."
          cd libEGL_static
          $LLVM_AR x ../libEGL_static.a
          $LLVM_AR rcs ../repacked/libEGL.a *.o
          cd ..
          
          echo "==> Repacking libGLESv2..."
          cd libGLESv2_static
          $LLVM_AR x ../libGLESv2_static.a
          $LLVM_AR rcs ../repacked/libGLESv2.a *.o
          cd ..
          
          echo "==> Final Repacked File Sizes (Should be MBs):"
          ls -lh repacked/

      - name: Upload Fat Archives
        uses: actions/upload-artifact@v4
        with:
          name: angle-ios-static-libs
          path: angle-work/src/out/ios/obj/repacked/*.a
          retention-days: 7
