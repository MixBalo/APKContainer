name: Build ANGLE iOS ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-angle:
    name: Build ANGLE static libraries for iOS ARM64
    runs-on: macos-latest

    env:
      ANGLE_SRC: ${{ github.workspace }}/angle-work
      ANGLE_OUT: ${{ github.workspace }}/angle-work/out/ios-arm64
      IOS_DEPLOYMENT_TARGET: "16.0"

    steps:
      # ============================================================
      # Checkout APKContainer
      # ============================================================

      - name: Checkout APKContainer
        uses: actions/checkout@v6

      # ============================================================
      # Xcode
      # ============================================================

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail

          echo "Available Xcode installations:"
          ls -1 /Applications | grep '^Xcode' || true

          # macos-latest normally provides the current stable Xcode.
          # Do not hard-code an obsolete Xcode path.
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

          echo "Xcode:"
          xcodebuild -version

          echo "SDK:"
          xcrun --sdk iphoneos --show-sdk-path

          echo "Clang:"
          xcrun --sdk iphoneos clang --version

      # ============================================================
      # depot_tools
      # ============================================================

      - name: Install depot_tools
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "$HOME/depot_tools" ]; then
            git clone --depth=1 \
              https://chromium.googlesource.com/chromium/tools/depot_tools.git \
              "$HOME/depot_tools"
          fi

          echo "$HOME/depot_tools" >> "$GITHUB_PATH"

          export PATH="$HOME/depot_tools:$PATH"

          echo "depot_tools:"
          command -v fetch || true
          command -v gclient || true

      # ============================================================
      # Fetch ANGLE
      # ============================================================

      - name: Fetch ANGLE
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$ANGLE_SRC"
          mkdir -p "$ANGLE_SRC"

          cd "$ANGLE_SRC"

          fetch angle

      # ============================================================
      # Synchronize ANGLE dependencies
      # ============================================================

      - name: Sync ANGLE
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANGLE_SRC"

          gclient sync --no-history --jobs=4

      # ============================================================
      # Make GN available
      #
      # Do not assume `gn` happens to be on PATH.
      # ANGLE/depot_tools normally provides the generated GN binary.
      # ============================================================

      - name: Locate GN
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$HOME/depot_tools:$PATH"

          cd "$ANGLE_SRC"

          echo "Searching for GN..."

          GN=""

          for candidate in \
            "$(command -v gn 2>/dev/null || true)" \
            "$ANGLE_SRC/buildtools/mac/gn" \
            "$ANGLE_SRC/buildtools/mac/gn/gn" \
            "$HOME/depot_tools/gn" \
            "$HOME/depot_tools/gn.py"
          do
            if [ -n "$candidate" ] && [ -x "$candidate" ]; then
              GN="$candidate"
              break
            fi
          done

          if [ -z "$GN" ]; then
            echo "GN was not found after gclient sync."

            echo ""
            echo "Searching checkout:"
            find "$ANGLE_SRC" \
              -type f \
              \( -name gn -o -name gn.py \) \
              -print 2>/dev/null | head -50

            echo ""
            echo "PATH:"
            echo "$PATH"

            exit 1
          fi

          echo "GN:"
          echo "$GN"

          "$GN" --version

          echo "GN_BIN=$GN" >> "$GITHUB_ENV"

      # ============================================================
      # Verify exact ANGLE revision
      # ============================================================

      - name: Verify ANGLE source
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANGLE_SRC"

          echo "ANGLE source:"
          pwd

          echo ""
          echo "ANGLE revision:"
          git rev-parse HEAD

          echo ""
          git log -1 --oneline

          echo ""
          echo "BUILD.gn:"
          test -f BUILD.gn

          echo ""
          echo "gni/angle.gni:"
          test -f gni/angle.gni

          echo ""
          echo "ANGLE static targets:"
          grep -n \
            -E \
            'libGLESv2_(thin_)?static|libEGL_static' \
            BUILD.gn

      # ============================================================
      # Patch ANGLE:
      #
      # Create a genuinely COMPLETE libGLESv2 static target.
      #
      # We intentionally do NOT try to make libEGL complete because
      # APKContainer links both archives:
      #
      #   libEGL.a
      #   libGLESv2.a
      #
      # Making both complete would duplicate the entire ANGLE core.
      #
      # The complete GLES archive contains:
      #
      #   libGLESv2 entry points
      #   libGLESv2 implementation wrapper
      #   libANGLE
      #   Metal backend
      #   ANGLE's static dependencies
      #
      # libEGL.a remains the EGL front-end.
      # ============================================================

      - name: Add complete ANGLE iOS target
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANGLE_SRC"

          python3 <<'PY'
          from pathlib import Path

          path = Path("BUILD.gn")
          text = path.read_text()

          target = 'static_library("libGLESv2_ios_complete")'

          if target in text:
              print("Complete target already exists.")
              raise SystemExit(0)

          marker = 'angle_static_library("libGLESv2_static") {'

          if marker not in text:
              raise SystemExit(
                  "ERROR: Could not find libGLESv2_static target."
              )

          insert = r'''
          # ============================================================
          # APKContainer iOS complete static ANGLE library.
          #
          # libGLESv2_static is intentionally only the small public
          # library wrapper. The actual implementation lives behind
          # libGLESv2_thin_static -> libANGLE and its dependencies.
          #
          # This target is the distributable monolithic archive.
          # ============================================================

          static_library("libGLESv2_ios_complete") {
            sources = libglesv2_entry_point_sources + libglesv2_sources

            configs += [
              ":debug_annotations_config",
            ]

            public_configs += [
              ":angle_static_config",
            ]

            deps = [
              ":includes",
              ":libANGLE",
            ]

            complete_static_lib = true
          }

          '''

          text = text.replace(
              marker,
              insert + marker,
              1,
          )

          path.write_text(text)

          print("Added libGLESv2_ios_complete.")
          PY

          echo ""
          echo "Verifying target:"
          grep -n -A35 \
            'static_library("libGLESv2_ios_complete")' \
            BUILD.gn

      # ============================================================
      # Generate GN files
      # ============================================================

      - name: Generate GN build
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANGLE_SRC"

          rm -rf "$ANGLE_OUT"

          "$GN_BIN" gen "$ANGLE_OUT" --args='
            target_os="ios"
            target_cpu="arm64"
            target_environment="device"

            ios_deployment_target="16.0"

            is_debug=false
            is_component_build=false

            ios_enable_code_signing=false

            angle_enable_vulkan=false
            angle_enable_gl=false
            angle_enable_metal=true

            angle_build_tests=false
            angle_build_perftests=false
            angle_build_samples=false

            use_thin_archives=false
          '

      # ============================================================
      # Inspect configuration
      # ============================================================

      - name: Inspect GN configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANGLE_SRC"

          echo "=================================================="
          echo "GN ARGS"
          echo "=================================================="

          "$GN_BIN" args "$ANGLE_OUT" --list

          echo ""
          echo "=================================================="
          echo "COMPLETE GLES TARGET"
          echo "=================================================="

          "$GN_BIN" desc \
            "$ANGLE_OUT" \
            //:libGLESv2_ios_complete

          echo ""
          echo "=================================================="
          echo "EGL TARGET"
          echo "=================================================="

          "$GN_BIN" desc \
            "$ANGLE_OUT" \
            //:libEGL_static

      # ============================================================
      # Build the complete GLES archive
      # ============================================================

      - name: Build complete ANGLE GLES library
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANGLE_SRC"

          echo "Building complete ANGLE GLES archive..."

          autoninja \
            -C "$ANGLE_OUT" \
            libGLESv2_ios_complete

      # ============================================================
      # Build EGL front-end
      # ============================================================

      - name: Build EGL library
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANGLE_SRC"

          echo "Building ANGLE EGL archive..."

          autoninja \
            -C "$ANGLE_OUT" \
            libEGL_static

      # ============================================================
      # Prepare final APKContainer archives
      #
      # IMPORTANT:
      #
      # APKContainer expects:
      #
      # Native/ANGLE/lib/libEGL.a
      # Native/ANGLE/lib/libGLESv2.a
      # ============================================================

      - name: Prepare ANGLE libraries
        shell: bash
        run: |
          set -euo pipefail

          SRC_EGL="$ANGLE_OUT/obj/libEGL_static.a"
          SRC_GLES="$ANGLE_OUT/obj/libGLESv2_ios_complete.a"

          FINAL="$GITHUB_WORKSPACE/Native/ANGLE/lib"

          echo "EGL source:"
          echo "$SRC_EGL"

          echo "GLES source:"
          echo "$SRC_GLES"

          test -f "$SRC_EGL"
          test -f "$SRC_GLES"

          rm -rf "$FINAL"
          mkdir -p "$FINAL"

          cp "$SRC_EGL" "$FINAL/libEGL.a"
          cp "$SRC_GLES" "$FINAL/libGLESv2.a"

          echo ""
          echo "Final ANGLE libraries:"
          ls -lh "$FINAL"

      # ============================================================
      # Validate archive types
      # ============================================================

      - name: Validate archive format
        shell: bash
        run: |
          set -euo pipefail

          EGL="$GITHUB_WORKSPACE/Native/ANGLE/lib/libEGL.a"
          GLES="$GITHUB_WORKSPACE/Native/ANGLE/lib/libGLESv2.a"

          echo "=================================================="
          echo "FILE TYPES"
          echo "=================================================="

          file "$EGL"
          file "$GLES"

          if file "$EGL" | grep -qi "thin"; then
            echo "ERROR: libEGL.a is thin."
            exit 1
          fi

          if file "$GLES" | grep -qi "thin"; then
            echo "ERROR: libGLESv2.a is thin."
            exit 1
          fi

      # ============================================================
      # Validate archive members
      # ============================================================

      - name: Validate archive contents
        shell: bash
        run: |
          set -euo pipefail

          EGL="$GITHUB_WORKSPACE/Native/ANGLE/lib/libEGL.a"
          GLES="$GITHUB_WORKSPACE/Native/ANGLE/lib/libGLESv2.a"

          EGL_SIZE=$(stat -f%z "$EGL")
          GLES_SIZE=$(stat -f%z "$GLES")

          EGL_MEMBERS=$(
            /usr/bin/ar -t "$EGL" |
            grep -v '^__.SYMDEF' |
            wc -l |
            tr -d ' '
          )

          GLES_MEMBERS=$(
            /usr/bin/ar -t "$GLES" |
            grep -v '^__.SYMDEF' |
            wc -l |
            tr -d ' '
          )

          echo "libEGL.a:"
          echo "  Size:    $EGL_SIZE bytes"
          echo "  Objects: $EGL_MEMBERS"

          echo ""
          echo "libGLESv2.a:"
          echo "  Size:    $GLES_SIZE bytes"
          echo "  Objects: $GLES_MEMBERS"

          # EGL can legitimately be one object.
          if [ "$EGL_MEMBERS" -lt 1 ]; then
            echo "ERROR: libEGL.a contains no object members."
            exit 1
          fi

          # The complete GLES library MUST contain substantially more
          # than the one-object wrapper archive.
          if [ "$GLES_MEMBERS" -lt 20 ]; then
            echo "ERROR: libGLESv2.a does not look like a complete ANGLE archive."
            echo ""
            /usr/bin/ar -t "$GLES"
            exit 1
          fi

      # ============================================================
      # Extract objects and verify ARM64
      # ============================================================

      - name: Validate ARM64 objects
        shell: bash
        run: |
          set -euo pipefail

          EGL="$GITHUB_WORKSPACE/Native/ANGLE/lib/libEGL.a"
          GLES="$GITHUB_WORKSPACE/Native/ANGLE/lib/libGLESv2.a"

          TMP_EGL=$(mktemp -d)
          TMP_GLES=$(mktemp -d)

          cleanup() {
            rm -rf "$TMP_EGL" "$TMP_GLES"
          }

          trap cleanup EXIT

          (
            cd "$TMP_EGL"
            /usr/bin/ar -x "$EGL"
          )

          (
            cd "$TMP_GLES"
            /usr/bin/ar -x "$GLES"
          )

          EGL_ARM64=0
          GLES_ARM64=0

          while IFS= read -r -d '' obj; do
            if file "$obj" | grep -Eqi 'Mach-O.*arm64'; then
              EGL_ARM64=$((EGL_ARM64 + 1))
            else
              echo "ERROR: non-arm64 EGL object:"
              file "$obj"
              exit 1
            fi
          done < <(
            find "$TMP_EGL" \
              -type f \
              -name '*.o' \
              -print0
          )

          while IFS= read -r -d '' obj; do
            if file "$obj" | grep -Eqi 'Mach-O.*arm64'; then
              GLES_ARM64=$((GLES_ARM64 + 1))
            else
              echo "ERROR: non-arm64 GLES object:"
              file "$obj"
              exit 1
            fi
          done < <(
            find "$TMP_GLES" \
              -type f \
              -name '*.o' \
              -print0
          )

          echo "EGL ARM64 objects:  $EGL_ARM64"
          echo "GLES ARM64 objects: $GLES_ARM64"

          [ "$EGL_ARM64" -gt 0 ]
          [ "$GLES_ARM64" -gt 0 ]

      # ============================================================
      # Verify symbols
      # ============================================================

      - name: Validate ANGLE symbols
        shell: bash
        run: |
          set -euo pipefail

          EGL="$GITHUB_WORKSPACE/Native/ANGLE/lib/libEGL.a"
          GLES="$GITHUB_WORKSPACE/Native/ANGLE/lib/libGLESv2.a"

          EGL_SYMBOLS=$(
            nm -gU "$EGL" 2>/dev/null |
            wc -l |
            tr -d ' '
          )

          GLES_SYMBOLS=$(
            nm -gU "$GLES" 2>/dev/null |
            wc -l |
            tr -d ' '
          )

          echo "EGL global symbols:  $EGL_SYMBOLS"
          echo "GLES global symbols: $GLES_SYMBOLS"

          if [ "$EGL_SYMBOLS" -lt 50 ]; then
            echo "ERROR: EGL symbol count is unexpectedly low."
            exit 1
          fi

          if [ "$GLES_SYMBOLS" -lt 1000 ]; then
            echo "ERROR: GLES archive does not look like a complete ANGLE implementation."
            exit 1
          fi

          echo ""
          echo "Sample ANGLE symbols:"
          nm -gU "$GLES" 2>/dev/null |
            grep -E \
              'ANGLE|egl|gl' |
            head -50 || true

      # ============================================================
      # Verify Apple linker can consume both archives
      #
      # This is the important test.
      # ============================================================

      - name: Link test with Apple clang
        shell: bash
        run: |
          set -euo pipefail

          SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"

          TEST_DIR="$RUNNER_TEMP/angle-link-test"
          rm -rf "$TEST_DIR"
          mkdir -p "$TEST_DIR"

          cat > "$TEST_DIR/main.mm" <<'EOF'
          #include <EGL/egl.h>
          #include <GLES2/gl2.h>

          int main() {
              EGLDisplay display = eglGetDisplay(EGL_DEFAULT_DISPLAY);

              if (display == EGL_NO_DISPLAY) {
                  return 0;
              }

              return 0;
          }
          EOF

          xcrun --sdk iphoneos clang++ \
            -arch arm64 \
            -isysroot "$SDKROOT" \
            -miphoneos-version-min=16.0 \
            -std=c++20 \
            -I"$ANGLE_SRC/include" \
            "$TEST_DIR/main.mm" \
            -Wl,-force_load,"$GITHUB_WORKSPACE/Native/ANGLE/lib/libEGL.a" \
            -Wl,-force_load,"$GITHUB_WORKSPACE/Native/ANGLE/lib/libGLESv2.a" \
            -framework Foundation \
            -framework Metal \
            -framework MetalKit \
            -framework QuartzCore \
            -framework CoreGraphics \
            -framework UIKit \
            -lz \
            -o "$TEST_DIR/angle-link-test"

          file "$TEST_DIR/angle-link-test"

          if ! file "$TEST_DIR/angle-link-test" |
              grep -Eqi 'Mach-O.*arm64'; then
            echo "ERROR: link test did not produce arm64 Mach-O."
            exit 1
          fi

          echo ""
          echo "ANGLE Apple clang link test PASSED."

      # ============================================================
      # Final archive report
      # ============================================================

      - name: Final ANGLE report
        shell: bash
        run: |
          set -euo pipefail

          EGL="$GITHUB_WORKSPACE/Native/ANGLE/lib/libEGL.a"
          GLES="$GITHUB_WORKSPACE/Native/ANGLE/lib/libGLESv2.a"

          echo ""
          echo "=================================================="
          echo "FINAL ANGLE IOS ARM64 STATIC LIBRARIES"
          echo "=================================================="

          ls -lh "$EGL"
          ls -lh "$GLES"

          echo ""
          echo "libEGL.a:"
          /usr/bin/ar -t "$EGL" |
            grep -v '^__.SYMDEF' |
            wc -l

          echo ""
          echo "libGLESv2.a:"
          /usr/bin/ar -t "$GLES" |
            grep -v '^__.SYMDEF' |
            wc -l

          echo ""
          echo "=================================================="
          echo "ANGLE IOS ARM64 STATIC LIBRARIES PASSED"
          echo "=================================================="

      # ============================================================
      # Upload
      # ============================================================

      - name: Upload ANGLE libraries
        uses: actions/upload-artifact@v7
        with:
          name: angle-ios-arm64-static-libs
          path: Native/ANGLE/lib/
          if-no-files-found: error
          retention-days: 7
