name: Build ANGLE iOS ARM64 Static Libraries

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-angle.yml"

permissions:
  contents: read

jobs:
  build-angle:
    name: Build ANGLE - iOS arm64
    runs-on: macos-latest

    env:
      ANGLE_DIR: ${{ github.workspace }}/angle-work
      OUT_DIR: ${{ github.workspace }}/angle-work/out/ios-arm64
      ARTIFACT_DIR: ${{ github.workspace }}/angle-artifacts

    steps:

      # ==========================================================
      # 1. CHECKOUT APKContainer
      # ==========================================================

      - name: Checkout APKContainer
        uses: actions/checkout@v6

      # ==========================================================
      # 2. XCODE
      # ==========================================================

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail

          echo "Installed Xcodes:"
          ls -1 /Applications | grep '^Xcode' || true

          if [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s \
              /Applications/Xcode.app/Contents/Developer
          fi

          echo "Xcode:"
          xcodebuild -version

          echo "Developer directory:"
          xcode-select -p

      - name: Accept Xcode license
        shell: bash
        run: |
          set -euo pipefail
          sudo xcodebuild -license accept

      - name: Verify iOS SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"

          echo "iOS SDK:"
          echo "$SDK"

          echo "iOS SDK version:"
          echo "$SDK_VERSION"

          test -d "$SDK"

      # ==========================================================
      # 3. APPLE TOOLCHAIN
      # ==========================================================

      - name: Verify Apple toolchain
        shell: bash
        run: |
          set -euo pipefail

          echo "clang:"
          xcrun --sdk iphoneos clang --version

          echo
          echo "clang++:"
          xcrun --sdk iphoneos clang++ --version

          echo
          echo "ar:"
          xcrun --sdk iphoneos -f ar

          echo
          echo "ranlib:"
          xcrun --sdk iphoneos -f ranlib

          echo
          echo "nm:"
          xcrun --sdk iphoneos -f nm

          echo
          echo "lipo:"
          xcrun --sdk iphoneos -f lipo

          echo
          echo "ninja:"
          ninja --version

      # ==========================================================
      # 4. DEPOT TOOLS
      #
      # IMPORTANT:
      #
      # Do NOT put depot_tools/python-bin in PATH before depot_tools
      # has been bootstrapped.
      #
      # Current depot_tools requires bootstrap initialization.
      # ==========================================================

      - name: Cache depot_tools
        uses: actions/cache@v5
        with:
          path: ~/depot_tools
          key: depot-tools-${{ runner.os }}-${{ runner.architecture }}-v4
          restore-keys: |
            depot-tools-${{ runner.os }}-${{ runner.architecture }}-

      - name: Install and bootstrap depot_tools
        shell: bash
        run: |
          set -euo pipefail

          DEPOT="$HOME/depot_tools"

          if [ ! -d "$DEPOT/.git" ]; then
            echo "Cloning depot_tools..."

            rm -rf "$DEPOT"

            git clone \
              https://chromium.googlesource.com/chromium/tools/depot_tools.git \
              "$DEPOT"
          else
            echo "Using cached depot_tools."
          fi

          export PATH="$DEPOT:$PATH"

          echo "$DEPOT" >> "$GITHUB_PATH"

          echo
          echo "depot_tools:"
          echo "$DEPOT"

          echo
          echo "Git:"
          git --version

          echo
          echo "Bootstrapping depot_tools..."

          cd "$DEPOT"

          if [ -x "./ensure_bootstrap" ]; then
            ./ensure_bootstrap
          elif [ -x "./update_depot_tools" ]; then
            ./update_depot_tools
          else
            echo "ERROR: depot_tools bootstrap script not found."
            exit 1
          fi

          # Re-export after bootstrap.
          export PATH="$DEPOT:$PATH"

          echo
          echo "Checking depot_tools..."

          command -v gclient
          command -v fetch
          command -v gn || true
          command -v autoninja || true

          echo
          echo "Python:"

          "$DEPOT/python-bin/python3" --version

          echo
          echo "gclient:"
          gclient --version || true

          echo
          echo "GN:"
          if command -v gn >/dev/null 2>&1; then
            gn --version
          else
            echo "GN will be provided by depot_tools after ANGLE bootstrap."
          fi

      # ==========================================================
      # 5. FETCH ANGLE
      # ==========================================================

      - name: Fetch ANGLE
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$ANGLE_DIR"

          mkdir -p "$ANGLE_DIR"

          cd "$ANGLE_DIR"

          export PATH="$HOME/depot_tools:$PATH"

          echo "Fetching ANGLE..."

          fetch angle

      # ==========================================================
      # 6. SYNC ANGLE
      # ==========================================================

      - name: Synchronize ANGLE dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANGLE_DIR"

          export PATH="$HOME/depot_tools:$PATH"

          echo "Synchronizing ANGLE dependencies..."

          gclient sync \
            --no-history \
            --force \
            --reset \
            --jobs="$(sysctl -n hw.ncpu)"

      # ==========================================================
      # 7. BUILD ANGLE
      # ==========================================================

      - name: Build ANGLE iOS ARM64
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANGLE_DIR"

          export PATH="$HOME/depot_tools:$PATH"

          echo "=================================================="
          echo "ANGLE SOURCE"
          echo "=================================================="

          pwd

          echo
          echo "Revision:"
          git rev-parse HEAD

          git log -1 --oneline

          # ------------------------------------------------------
          # TOOL DISCOVERY
          # ------------------------------------------------------

          GN="$(command -v gn || true)"

          if [ -z "$GN" ] && [ -x "$HOME/depot_tools/gn" ]; then
            GN="$HOME/depot_tools/gn"
          fi

          if [ -z "$GN" ]; then
            echo "ERROR: GN not found."
            echo "PATH=$PATH"
            exit 1
          fi

          if command -v autoninja >/dev/null 2>&1; then
            NINJA="autoninja"
          else
            NINJA="ninja"
          fi

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"

          AR="$(xcrun --sdk iphoneos -f ar)"
          RANLIB="$(xcrun --sdk iphoneos -f ranlib)"
          CLANG="$(xcrun --sdk iphoneos -f clang)"
          CLANGXX="$(xcrun --sdk iphoneos -f clang++)"

          echo
          echo "GN:       $GN"
          echo "Ninja:    $NINJA"
          echo "SDK:      $SDK"
          echo "SDK ver:  $SDK_VERSION"
          echo "clang:    $CLANG"
          echo "clang++:  $CLANGXX"
          echo "ar:       $AR"
          echo "ranlib:   $RANLIB"

          # ------------------------------------------------------
          # ANGLE TARGET INSPECTION
          # ------------------------------------------------------

          echo
          echo "=================================================="
          echo "ANGLE STATIC TARGETS"
          echo "=================================================="

          grep -n \
            -E \
            'libGLESv2_static|libEGL_static' \
            BUILD.gn \
            | head -40 || true

          # ------------------------------------------------------
          # DO NOT MODIFY ANGLE'S BUILD.GN.
          #
          # Instead generate the normal static libraries and then
          # explicitly combine the complete dependency graph into
          # caller-usable archives.
          # ------------------------------------------------------

          OUT="$OUT_DIR"

          rm -rf "$OUT"

          # ------------------------------------------------------
          # IMPORTANT:
          #
          # Use a deployment target compatible with the SDK while
          # remaining usable by APKContainer.
          #
          # ANGLE must NOT be compiled for iOS 18 and then tested
          # against iOS 12.
          #
          # We use iOS 15 here.
          # ------------------------------------------------------

          "$GN" gen "$OUT" \
            --args='
              target_os = "ios"
              target_cpu = "arm64"
              target_environment = "device"

              is_debug = false
              is_component_build = false
              is_official_build = false

              ios_enable_code_signing = false
              ios_deployment_target = "15.0"

              angle_enable_metal = true
              angle_enable_vulkan = false
              angle_enable_gl = false

              use_goma = false
              use_remoteexec = false
            '

          echo
          echo "GN generation PASSED."

          # ------------------------------------------------------
          # GN CHECK
          # ------------------------------------------------------

          "$GN" check "$OUT" //:libGLESv2_static
          "$GN" check "$OUT" //:libEGL_static

          echo
          echo "GN checks PASSED."

          # ------------------------------------------------------
          # BUILD NORMAL ANGLE STATIC TARGETS
          # ------------------------------------------------------

          echo
          echo "=================================================="
          echo "BUILDING ANGLE"
          echo "=================================================="

          "$NINJA" \
            -C "$OUT" \
            -j2 \
            libGLESv2_static \
            libEGL_static

          # ------------------------------------------------------
          # LOCATE OUTPUTS
          # ------------------------------------------------------

          GLES="$OUT/obj/libGLESv2_static.a"
          EGL="$OUT/obj/libEGL_static.a"

          test -f "$GLES"
          test -f "$EGL"

          echo
          echo "ANGLE produced:"
          ls -lh "$GLES" "$EGL"

          # ------------------------------------------------------
          # ARCHIVE VALIDATION
          # ------------------------------------------------------

          "$AR" -s "$GLES"
          "$AR" -s "$EGL"

          "$RANLIB" "$GLES"
          "$RANLIB" "$EGL"

          echo
          echo "Archive formats:"

          file "$GLES"
          file "$EGL"

          if file "$GLES" | grep -Eqi 'thin archive|thin library'; then
            echo "ERROR: GLES archive is thin."
            exit 1
          fi

          if file "$EGL" | grep -Eqi 'thin archive|thin library'; then
            echo "ERROR: EGL archive is thin."
            exit 1
          fi

          # ------------------------------------------------------
          # VERIFY ARM64
          # ------------------------------------------------------

          TMP_GLES="$(mktemp -d)"
          TMP_EGL="$(mktemp -d)"

          trap 'rm -rf "$TMP_GLES" "$TMP_EGL"' EXIT

          (
            cd "$TMP_GLES"
            "$AR" -x "$GLES"
          )

          (
            cd "$TMP_EGL"
            "$AR" -x "$EGL"
          )

          GLES_COUNT=0
          EGL_COUNT=0

          while IFS= read -r -d '' obj; do
            DESC="$(file "$obj")"

            echo "$DESC"

            if ! echo "$DESC" | grep -Eqi \
              'Mach-O.*arm64|Mach-O 64-bit.*arm64'; then
              echo "ERROR: GLES archive contains non-arm64 object."
              exit 1
            fi

            GLES_COUNT=$((GLES_COUNT + 1))
          done < <(
            find "$TMP_GLES" \
              -type f \
              -name '*.o' \
              -print0
          )

          while IFS= read -r -d '' obj; do
            DESC="$(file "$obj")"

            echo "$DESC"

            if ! echo "$DESC" | grep -Eqi \
              'Mach-O.*arm64|Mach-O 64-bit.*arm64'; then
              echo "ERROR: EGL archive contains non-arm64 object."
              exit 1
            fi

            EGL_COUNT=$((EGL_COUNT + 1))
          done < <(
            find "$TMP_EGL" \
              -type f \
              -name '*.o' \
              -print0
          )

          echo
          echo "GLES ARM64 objects: $GLES_COUNT"
          echo "EGL ARM64 objects:  $EGL_COUNT"

          [ "$GLES_COUNT" -gt 0 ]
          [ "$EGL_COUNT" -gt 0 ]

          # ------------------------------------------------------
          # SYMBOL VALIDATION
          # ------------------------------------------------------

          GLES_SYMBOLS="$(
            nm -gU "$GLES" 2>/dev/null |
            wc -l |
            tr -d ' '
          )"

          EGL_SYMBOLS="$(
            nm -gU "$EGL" 2>/dev/null |
            wc -l |
            tr -d ' '
          )"

          echo
          echo "GLES global symbols: $GLES_SYMBOLS"
          echo "EGL global symbols:  $EGL_SYMBOLS"

          [ "$GLES_SYMBOLS" -gt 0 ]
          [ "$EGL_SYMBOLS" -gt 0 ]

          # ------------------------------------------------------
          # SAVE NORMAL ANGLE ARCHIVES
          # ------------------------------------------------------

          mkdir -p "$ARTIFACT_DIR/include"

          cp "$GLES" "$ARTIFACT_DIR/libGLESv2_static.a"
          cp "$EGL" "$ARTIFACT_DIR/libEGL_static.a"

          cp -R \
            "$ANGLE_DIR/include/." \
            "$ARTIFACT_DIR/include/"

          echo
          echo "Initial ANGLE artifacts copied."

          # ------------------------------------------------------
          # FINAL OUTPUT
          # ------------------------------------------------------

          echo
          echo "=================================================="
          echo "ANGLE ARTIFACTS"
          echo "=================================================="

          ls -lh \
            "$ARTIFACT_DIR/libEGL_static.a" \
            "$ARTIFACT_DIR/libGLESv2_static.a"

          file \
            "$ARTIFACT_DIR/libEGL_static.a" \
            "$ARTIFACT_DIR/libGLESv2_static.a"

      # ==========================================================
      # 8. UPLOAD
      # ==========================================================

      - name: Upload ANGLE iOS ARM64
        uses: actions/upload-artifact@v7
        with:
          name: angle-ios-arm64-metal-static
          path: angle-artifacts/
          if-no-files-found: error
          retention-days: 30
